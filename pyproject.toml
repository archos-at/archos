[tool.pytest.ini_options]
testpaths = [
    "tests",
    "evals",
    "packages/agent/tests",
    "packages/knowledge-layer/tests",
    "packages/public-sources/tests",
    "packages/ris-adapter/tests",
    "packages/tavily-web-search/tests",
]
addopts = "--import-mode=importlib -m 'not live and not code_runner'"
pythonpath = [".", "packages/agent/src", "apps/agent-host/src", "evals/oib-retrieval/src", "packages/knowledge-layer/testing", "packages/ris-adapter/testing", "packages/public-sources/testing", "packages/agent/tests/testing"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
markers = [
  "live: needs a real model behind OPENROUTER_API_KEY; deselected unless -m live",
  "code_runner: starts the real code runner; deselected unless -m code_runner",
]


[tool.ruff]
src = [".", "packages/agent/src"]
line-length = 120
target-version = "py314"
[tool.ruff.per-file-target-version]
"ci/**/*.py" = "py312"
"scripts/check_*.py" = "py312"
"scripts/release_notes*.py" = "py312"

[tool.ruff.lint]

select = [
  "E",
  "F",
  "W",
  "I",
  "PL",
  "UP",
  "TID251",
]

extend-ignore = [
  "PLC0415", # Allow lazy imports inside functions
  "PLR0904", # too-many-public-methods
  "PLR0911", # too-many-return-statements
  "PLR0912", # too-many-branches
  "PLR0913", # too-many-arguments
  "PLR0914", # too-many-locals
  "PLR0915", # too-many-statements
  "PLR0917", # too-many-positional-arguments
  "PLR1702", # too-many-nested-blocks
  "PLR2004", # Magic value used in comparison this happens a lot within unittests
  "PLW0108", # unnecessary-lambda
  "PLW2901", # allow re-assigning a loop variable
  "PLW0603",
  "PLE1205"
]

# still come from here, with `# noqa: TID251` saying it is internal.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"nat.builder.builder".msg = "Import from nat.plugin_api"
"nat.builder.context".msg = "Import from nat.plugin_api"
"nat.builder.evaluator".msg = "Import from nat.plugin_api"
"nat.builder.framework_enum".msg = "Import from nat.plugin_api"
"nat.builder.function".msg = "Import from nat.plugin_api"
"nat.builder.function_info".msg = "Import from nat.plugin_api"
"nat.cli.register_workflow".msg = "Import from nat.plugin_api"
"nat.data_models.component_ref".msg = "Import from nat.plugin_api"
"nat.data_models.evaluator".msg = "Import from nat.plugin_api"
"nat.data_models.function".msg = "Import from nat.plugin_api"
"nat.data_models.interactive".msg = "Import from nat.plugin_api"
"nat.data_models.api_server".msg = "The chat wire is agent.common.wire_v2 (ADR-0068), not NAT's frame models"

[tool.ruff.lint.per-file-ignores]
"docs/notebooks/*.ipynb" = ["E501", "E402"]

[tool.ruff.lint.isort]
combine-as-imports = true
default-section = "third-party"
force-single-line = true
known-first-party = ["agent", "agent_host", "nat", "nat_*", "_utils"]
known-third-party = [
  "agno",
  "autogen",
  "crewai",
  "google",
  "langchain",
  "llama_index",
  "mem0ai",
  "redis",
  "semantic_kernel",
  "zep_cloud",
]
order-by-type = true

[tool.importlinter]
root_packages = ["agent", "agent_host", "knowledge_layer"]
include_external_packages = true

[[tool.importlinter.contracts]]
id = "qdrant-client-confined"
name = "Only knowledge_layer.vector_store imports qdrant_client"
type = "forbidden"
source_modules = ["agent", "agent_host", "knowledge_layer"]
forbidden_modules = ["qdrant_client"]
allow_indirect_imports = true
ignore_imports = ["knowledge_layer.vector_store.** -> qdrant_client"]

[[tool.importlinter.contracts]]
id = "agent-api-seam"
name = "agent never imports agent_host: the API tier hosts the agent, not the reverse"
type = "forbidden"
source_modules = ["agent"]
forbidden_modules = ["agent_host"]

[[tool.importlinter.contracts]]
id = "agent-knowledge-port"
name = "agent reaches knowledge_layer only through the retriever and ingestor port (ADR-0072)"
type = "forbidden"
source_modules = ["agent"]
forbidden_modules = ["knowledge_layer"]
allow_indirect_imports = true
ignore_imports = [
  "agent.knowledge.factory -> knowledge_layer.**",
  "agent.knowledge.licences -> knowledge_layer.estate",
  "agent.core.register -> knowledge_layer.chat_binding",
  "agent.core.register -> knowledge_layer.estate",
  "agent.knowledge.collection_pages -> knowledge_layer.chunk_positions",
  "agent.knowledge.collection_pages -> knowledge_layer.vector_store",
  "agent.knowledge.folder_cards.inputs -> knowledge_layer.browse",
  "agent.knowledge.folder_cards.worker -> knowledge_layer.browse",
  "agent.knowledge.folder_cards.worker -> knowledge_layer.vector_store",
  "agent.knowledge.scoping -> knowledge_layer.search",
  "agent.oib_sync -> knowledge_layer.ingest",
  "agent.tools.cross_project.hit_judge -> knowledge_layer.search",
  "agent.tools.cross_project.lookup_rendering -> knowledge_layer.search",
  "agent.tools.look.reading -> knowledge_layer.ingest",
  "agent.tools.look.register -> knowledge_layer.view_image",
  "agent.tools.look.resolve -> knowledge_layer.view_image",
  "agent.knowledge.law_lookup.render -> knowledge_layer.search",
  "agent.knowledge.law_lookup.sections -> knowledge_layer.search",
]

[tool.yapf]
based_on_style = "pep8"
column_limit = 120
split_all_top_level_comma_separated_values = true
join_multiple_lines = true
indent_dictionary_value = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-env>=1.8.1",
    "pre-commit>=3.5.0",
    "ruff~=0.17.2",
    "yapf>=0.40.0",
    "mypy>=2.3.0",
    "fakeredis[lua]>=2.40.0",
    "agent",
    "tavily-web-search",
    "ris-adapter",
    "public-sources",
    "knowledge-layer[all]",
    "agent-host",
    "oib-retrieval",
    "pytest-xdist>=3.8.0",
    "pytest-split>=0.11.0",
    "pytest-testmon>=2.2.0",
    "import-linter>=2.15",
    "python-stdnum>=1.20",
    "tree-sitter>=0.25",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-javascript>=0.23",
]

[tool.uv]
prerelease = "if-necessary-or-explicit"
override-dependencies = [
    "authlib>=1.6.11,<2",
    "cryptography>=50.0.0,<51",
    "pillow>=12.2.0,<14",
    "pygments>=2.20.0,<3",
    "pyopenssl>=26.0.0,<27",
    "tornado>=6.5.9",
    "banks>=2.4.2,<3",
    "lxml>=6.1.0,<7",
    "nltk>=3.9.4,<4",
    "pyasn1>=0.6.3,<0.7",
    "anyio>=4.14.2",
    "urllib3>=2.8.0",
    "virtualenv>=21.7.13",
    "langgraph-sdk>=0.4.4",
    "fsspec>=2026.6.0",
]

[tool.uv.pip]
prerelease = "if-necessary-or-explicit"

[tool.uv.workspace]
members = [
    "packages/agent",
    "packages/knowledge-layer",
    "packages/public-sources",
    "packages/ris-adapter",
    "packages/tavily-web-search",
    "apps/agent-host",
]

[tool.uv.sources]
agent = { workspace = true }
tavily-web-search = { workspace = true }
ris-adapter = { workspace = true }
public-sources = { workspace = true }
knowledge-layer = { workspace = true }
agent-host = { workspace = true }
oib-retrieval = { path = "evals/oib-retrieval", editable = true }
