# reno configuration — https://docs.openstack.org/reno/latest/
#
# Release notes in this repo are written for CUSTOMERS, not for the commit log.
# Three tiers read them (ADR-0156):
#
#   customers  every note in a customer section, verbatim (translated into
#              German), in the app's "What's new" for signed-in members,
#              grouped by week and product area;
#   public     the website's /changelog/ shows only the weekly summaries in
#              releasenotes/summaries.yaml, never a single note;
#   internal   `security`, `incident` and `operators` are kept here and reach
#              neither.
#
# Authoring:  task release:note -- <slug>
# Linting:    task release:lint     (also runs in CI on every PR)
# Summaries:  task release:week -- 2026-W44, then releasenotes/summaries.yaml
# Publishing: automatic, on merge to develop (.github/workflows/release-notes.yml)

# The section set. The order here is the order the app lists the customer ones
# in: what you gained, what got better, what got fixed, then the small print.
# `issues` and `critical` (reno defaults) are deliberately absent: a known-issues
# list belongs in support docs, not in product news.
#
# Which sections reach no reader is decided by INTERNAL_SECTIONS in
# scripts/release_notes_rules.py; the three at the bottom are those.
sections:
  - [features, New features]
  - [improvements, Improvements]
  - [fixes, Fixes]
  - [deprecations, Deprecations]
  - [upgrade, Upgrade notes]
  - [other, Other]
  # Never published from here down, neither in the app nor on the website. The
  # notes are product news for architects, not a bug register;
  # `task release:preview` still lists these.
  #
  # A vulnerability, a hardening, a dependency bumped for a CVE. A customer who
  # must know is told directly; a public line only advertises the hole.
  - [security, Security]
  # A severe fix: something that should never have happened. Data lost, or kept
  # after it was deleted; a permission or legal hold that did not hold; an
  # answer passed as checked when it was not; a false claim on the website.
  - [incident, Incidents]
  # Notes for the people who run the platform (the Platform area, model
  # defaults, deployment and migration steps).
  - [operators, For platform operators]

# `improvements` is ours, so reno's default semver mapping has to learn about
# it: a polish note is a patch-level change, the same as a fix.
semver_major: [upgrade]
semver_minor: [features]
semver_patch: [fixes, improvements, security, incident]

# The repo tags nothing yet (`git tag` is empty) and merges continuously into
# `develop`, so in practice every note lands unreleased and both artifacts group
# it by the week it shipped. Once release tagging starts, tagged versions group
# under the tag instead — no config change needed.
default_branch: develop
unreleased_version_title: Unreleased
add_release_date: true

# The template `reno new` starts an author off with. It carries the house rules
# because that is the only moment anyone reads them.
template: |
  ---
  # area: choose one of projects, documents, answers, search, building-law, bim,
  #   collaboration, tasks, office-knowledge, administration, agents, general
  #
  # Keep the line above with one area: where in the product the reader meets
  # this change. The app's "What's new" filters by it.
  #
  # Who reads what you write below:
  #   - every member of every office, in the app's "What's new", in English and
  #     in German translation: every entry in a customer section (features to
  #     other). Write it for the architect, not for the reviewer of your diff.
  #   - nobody outside the repository: `security`, `incident`, `operators`.
  #   - the public website shows none of it; it shows the week's summary,
  #     written later from the notes (releasenotes/summaries.yaml).
  #
  #   - English. The German is generated from it; a German note fails the lint.
  #   - At most two sentences and 400 characters: what the reader can now do,
  #     or what stopped going wrong for them. The mechanism goes in the PR.
  #   - No RST, backticks, issue numbers, file paths or internal names.
  #   - Only the people running the platform can act on it (the Platform area,
  #     model defaults, a deployment step)? Put it under `operators`.
  #   - A security fix goes under `security`; a severe fix (data lost or kept
  #     after deletion, a permission or legal hold that did not hold) under
  #     `incident`. A note in them still satisfies the PR check.
  #
  # Good: Uploading a corrected plan under the same name now replaces the old
  #       one instead of adding a second copy.
  # Bad:  Fixed dedup in the ingest path so re-uploads no longer create a
  #       duplicate row.  (mechanism, not effect)
  #
  # Delete every section you do not need — an empty one fails the lint.
  features:
    - >
      Say what is new, from the reader's side.
  improvements:
    - >
      Say what got better about something they already had.
  fixes:
    - >
      Say what used to go wrong, and that it no longer does.
  deprecations:
    - >
      Name what is going away and what replaces it.
  upgrade:
    - >
      Only when the reader has to do something themselves.
  other:
    - >
      Anything genuinely user-visible that fits nowhere above.
  security:
    - >
      Only for a vulnerability or hardening; never published.
  incident:
    - >
      Only for a severe fix that should never have happened; never published.
  operators:
    - >
      Only for the people running the platform; never published.
