---
# area: search
improvements:
  - >
    The search has a magnifier at the top of the sidebar, and the window behind
    it and behind Ctrl+K is now the search first: it finds files, chats and
    projects across the whole office, narrowed to one kind if you like, and
    shows what you opened from it last. The general entries stay under it; the
    list of projects and of the current project's sections is gone.
  - >
    The folded sidebar opens over the page when the pointer rests on it and
    folds again when the pointer leaves, so every place in it is one click away
    without keeping it open. Its signs stand at the height of their rows.
