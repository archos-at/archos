---
features:
  - >
    Once you file a mail's text into an E-Mail-Verlauf, later signed replies in
    that conversation are filed into it without a click, each attachment into
    the existing folder ARCHOS suggests for it. Only what has no existing
    folder or needs a look waits in the E-Mail-Eingang, and "Beenden" in the
    E-Mails tab stops it.
  - >
    Under "Bearbeitet", a mail filed this way says "Ohne Klick abgelegt" and
    names the E-Mail-Verlauf it went into.
