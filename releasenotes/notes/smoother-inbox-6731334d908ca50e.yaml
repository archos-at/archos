---
improvements:
  - >
    The inbox opens in one movement. It used to slide up twice, and its placeholder now has the shape of the list that replaces it.
  - >
    The message you open stays in the inbox while you read it. Opening your last unread message no longer flips the list to "all done" beside it.
  - >
    Archiving in the inbox is smoother: the rows below close the gap, a restored row fades back in, and the keyboard focus moves to the next entry.
fixes:
  - >
    Switching the inbox filter no longer shows the previous filter's rows for a moment, and a failed background refresh keeps the list on screen.
