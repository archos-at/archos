# area: office-knowledge
---
features:
  - >
    A standard in Grundlagen des Büros now opens as its file, in the same
    viewer as any document, with its edition, validity and last check beside
    it. Editing its details is one press away instead of the first thing you see.
  - >
    Adding a standard now takes you straight to its form: pick the file with
    „Grundlage hinzufügen“ (or take one from the Büroablage), check what was
    proposed, and confirm. Add several at once and „Bestätigen und weiter“
    leads through them one after another.
