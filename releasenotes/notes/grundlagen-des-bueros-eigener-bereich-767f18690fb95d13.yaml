# area: office-knowledge
---
features:
  - >
    Your office's standards, commentaries and directives now have a place of
    their own beside the Büroablage, with folders, filters for what still needs
    confirming or checking, and a page per standard. You find a standard and
    its state in seconds, and the Büroablage marks these files as Grundlage.
  - >
    A newer edition of a standard is added beside the earlier one, and answers
    use the edition that applied when the project was filed. Running projects
    keep their edition, by the same rule as the standards the platform holds.
