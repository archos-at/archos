---
# area: projects
improvements:
  - >
    The E-Mail-Eingang is calmer: each mail is two lines that say where it goes
    or what it still needs, threads stand under their own name, and a mail with
    nothing left to decide is filed with one press on „Ablegen“. A filing can be
    undone for a few seconds, and while you pick several mails, the right side
    shows where they will go.
