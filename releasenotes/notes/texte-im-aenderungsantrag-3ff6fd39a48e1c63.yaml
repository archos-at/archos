---
# area: administration
operators:
  - >
    An edition's text is now attached inside its change request, by upload or from a
    configured source's URL, and reviewers open it there. The reviewed file is the
    published one: each text is stored under a name of its own and never replaced.
    A second person compares an uploaded text with its source before anyone
    approves, also when approving alone.
  - >
    A text or a cited page fetched through a source that is still in a draft, or
    that one person released alone, is now checked by a second person like an
    uploaded one. Uploading a file under a name the base corpus already holds no
    longer replaces it: remove the file first.
