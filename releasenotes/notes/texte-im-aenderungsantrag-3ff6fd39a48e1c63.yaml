---
# area: administration
operators:
  - >
    An edition's text is now attached inside its change request, by upload or from a
    configured source's URL, and reviewers open it there. The reviewed file is the
    published one: a file a record names cannot be replaced, and a new text for a
    released edition takes a new name. A second person compares an uploaded text
    with its source before anyone approves, also when approving alone.
