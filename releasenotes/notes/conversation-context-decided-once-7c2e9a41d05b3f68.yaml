# area: agents
operators:
  - >
    The app can now decide what a chat turn may draw on, at the internal route
    /api/internal/turn-decision, and records per answer what it was allowed to
    read once a caller passes the answer's id; the agent starts doing so in a
    later release. The deploy adds conversations.audience_version and the table
    answer_contexts, with no backfill.
