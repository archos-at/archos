---
operators:
  - >
    What a chat turn may draw on is now decided once per turn in the app, at
    the new internal route /api/internal/turn-decision, and each answer keeps a
    server-written record of what it was allowed to read and what it read. The
    deploy adds the column conversations.audience_version and the table
    answer_contexts; both migrations run on their own and need no backfill.
