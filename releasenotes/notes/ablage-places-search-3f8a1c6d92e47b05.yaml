# area: documents
improvements:
  - >
    The E-Mail-Eingang and Offene Punkte now have a search where Dateien has its own, at the start of the Ablage's row of tools: „Im E-Mail-Eingang suchen …“ finds mails by sender, subject or the name of an attachment, „In den offenen Punkten suchen …“ finds points by their text, their document or who is responsible. The list narrows as you type, Escape clears the search, and it survives a reload.
