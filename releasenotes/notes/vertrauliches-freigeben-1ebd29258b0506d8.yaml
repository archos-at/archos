# area: documents
features:
  - >
    A draft built on restricted folders or other projects can now be filed anywhere you may write, after you check it and confirm it holds nothing confidential; the card names the sources, and admins can switch this off under Organisation › Prüfung.
improvements:
  - >
    In a personal chat, „In Meine Ablage legen“ now asks which folder of Meine Ablage the draft goes into.
