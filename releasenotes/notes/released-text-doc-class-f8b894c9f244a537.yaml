---
fixes:
  - >
    The published OIB-Richtlinien, their Erläuterungen, Leitfäden,
    Begriffsbestimmungen and the list of cited standards are filed under their
    document type again, instead of "Sonstiges Basisdokument". A search limited
    to a document type finds them, and their sources show the right type.
operators:
  - >
    A work record can state the document class its texts are filed under
    (docClass). Publishing a text stamps it, unless a person chose another
    class for that file. Texts published before this release keep the class
    they have; set them once with platform-knowledge-doc-class-update, or
    publish a change request that states the class on their works.
