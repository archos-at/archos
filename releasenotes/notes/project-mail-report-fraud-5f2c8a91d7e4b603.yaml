features:
  - >
    A mail in the E-Mail-Eingang that poses as a member of your office now
    has "Melden …" in its red warning. One press dismisses it and warns the
    project's managers, your office's administrators and the member it poses
    as: who sent it and its subject, without any IBAN, with "Bitte nicht
    zahlen und nicht antworten" and the advice to look for the same mail in
    their mail program.
