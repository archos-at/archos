---
# area: building-law
improvements:
  - >
    A research run now works from the same law as the chat: the editions that
    apply at the project's site, in their role there, or a clear note when that
    law cannot be named.
  - >
    Where the law of a project's site cannot be named (the office is not
    entitled to its country, or it cannot be read), no building class is
    named either: not in the evaluation, the setup or the project profile.
  - >
    An office's base knowledge entry keeps who proposed it after it is
    confirmed, and names who confirmed it.
  - >
    Where nobody has reviewed a country's records yet, the chat says it reads
    that law from an uncurated official source, and it says when a newer
    edition is known.
  - >
    A licensed standard your office holds but has not cleared for AI
    processing is now named in answers as held and not read, so the answer
    says why it cannot quote it instead of leaving it out.
operators:
  - >
    A statute read live in RIS can now carry its RIS law number and its ELI
    (ending with a slash) on its work record, so a passage read there is
    badged with its role.
    Propose them with the records; no migration is needed.
