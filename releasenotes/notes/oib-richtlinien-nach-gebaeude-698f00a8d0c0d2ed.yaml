# area: building-law
improvements:
  - >
    A guideline written only for some buildings, such as a garage or a
    high-rise, can now say so, and is then named only for the buildings it is
    for, in the setup and in the chat alike. Where a deciding fact is still
    missing it reads „zu prüfen“ and names it; where it applies it says why
    and opens its text.
operators:
  - >
    Migration 0221 lets an edition state which buildings it applies to.
    Propose Austria's scopes for OIB-RL 2.1, 2.2 and 2.3 as one change request
    for AT after the Austria pack; until they are published, nothing narrows.
