---
# area: documents
fixes:
  - >
    A PDF page no longer stays white when you open a plan in the preview, in the
    review view or to add an annotation. You no longer have to resize the window
    or fit the page again to make it appear.
  - >
    Pages further down a PDF are drawn before you scroll to them, and stay drawn
    when you scroll back, instead of flashing white.
  - >
    Opening an annotation from the file preview or a link now scrolls the review
    view to that annotation, not to a page a few pages earlier.
  - >
    After zooming in on selected text, the bar to copy it as a citation now stays
    next to the selection.
