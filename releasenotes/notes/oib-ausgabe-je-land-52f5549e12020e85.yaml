# area: office-knowledge
features:
  - >
    For a project in Austria, answers can now say which edition of the
    OIB-Richtlinien its Land declared binding and since when: the 2019 edition
    in Steiermark, Vorarlberg and Burgenland, the 2023 edition where a Land
    adopted it, and RL 6 in its 2025 edition in Wien and Tirol. A newer edition
    that a Land has not adopted is marked as guidance in the sources, no longer
    as binding.
operators:
  - >
    The building-law-chain flag is retired (ADR-0175). Answers name a binding
    edition only once the EU and Austria packs are published as change
    requests, the EU pack first; until then Austrian turns run on gate none.
    Migration 0211 adds relation records.
