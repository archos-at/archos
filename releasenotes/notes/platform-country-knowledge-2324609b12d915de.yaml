# area: office-knowledge
features:
  - >
    Answers now name the standards the platform lists for your country even when
    your office holds no copy, saying the text is not available, and an
    authority's directives reach a project only where that authority decides.
operators:
  - >
    Platform knowledge now changes only through a reviewed change request in
    Platform, Countries: reviewed claim by claim, approved by a second person,
    published to preview, then stable, and rolled back if needed. Off until the
    platform-base-knowledge flag is set; while on, the norm catalog takes no
    edits. Migration 0205 adds the tables.
