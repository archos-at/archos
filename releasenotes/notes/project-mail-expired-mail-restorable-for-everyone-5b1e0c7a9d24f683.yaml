features:
  - >
    An e-mail from outside the office that nobody filed within its 14 days can
    now be restored for 7 days under „Bearbeitet“, as every other expired or
    dismissed e-mail can. Its row in the E-Mail-Eingang says until when it stays
    („Bleibt bis 03.12. im E-Mail-Eingang“) instead of that it will be removed.
