---
improvements:
  - >
    The project selector at the top of the sidebar is one button with the
    project's name on a single line, and the list of projects opens right
    under it.
  - >
    On a phone you switch projects from „Mehr“: its first entry shows the
    project you are in, and „Projekt wechseln“ opens the list of projects.
    The top of each page names the project in one quiet line and leaves more
    room for the page.
  - >
    A project name too long for the selector is shortened in the middle, so
    its end stays readable, and is never wrapped onto a second line.
  - >
    The sidebar inside a project shows where you are: the section you are in
    is a white sheet with an edge, as the open tab in Dateien, and the other
    sections are set in black instead of grey.
  - >
    The lines between the parts of the sidebar are gone, in the sidebar and
    in the tab bar on a phone.
  - >
    The sidebar is a little wider, so most project names fit in full.
  - >
    Übersicht now stands with the project's other sections, under the project
    switcher, rather than at the foot of the sidebar among the organisation's
    Büroablage, Suche and Postfach.
  - >
    The collapsed sidebar lets you switch projects from it, and its tooltips
    name each area's keyboard shortcut.
  - >
    The connection state appears only while the connection is being restored
    or is gone; the green „Verbunden“ is no longer shown all the time.
  - >
    Büroablage, Suche and Postfach stand at the foot of the sidebar under your
    office's name, just above your own name; the project and its sections have
    the top to themselves.
  - >
    The project switcher in the sidebar has the search and the order of the
    one on a phone: the projects you opened last, then the rest. The collapsed
    sidebar shows the project's initials, so it says which project you are in.
  - >
    The counts beside Postfach are quiet grey pills, as the count beside the
    E-Mail-Eingang in Dateien.
  - >
    Above a project, the header marks „Projekte“ as the page you are on, and
    its Büroablage, Suche and Postfach show their names on wide screens.
  - >
    On a phone, „Mehr“ shows who is signed in and groups its entries under
    the project's and the office's names; Suche is reached from the search at
    the top.
fixes:
  - >
    The connection state reads „Verbindung unterbrochen“ or „Keine
    Verbindung“, in German, with a symbol beside the words instead of a
    coloured dot alone; while the server does not answer, „Erneut versuchen“
    checks again at once.
