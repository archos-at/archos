---
# area: documents
improvements:
  - >
    Your office can read in uploaded documents worth up to 10,000 credits a
    month, separately from your daily and monthly limit, and this allowance
    can now be raised for your office on request, for example before a large
    project folder goes up. The usage page shows the allowance that applies.
operators:
  - >
    The platform console's Kontingent dialog sets each office's monthly ingest
    allowance as an amount in its budget unit. The default is 10,000 credits
    (three times the monthly limit in tokens), and "Use default" goes back to it.
