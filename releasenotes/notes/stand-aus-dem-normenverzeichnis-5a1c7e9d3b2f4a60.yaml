# area: office-knowledge
---
features:
  - >
    Under Normen & Richtlinien a norm's Stand now comes from the standards
    directory where it lists the norm: „Aktuell“ when your office holds the
    edition in force today, „Neuere Ausgabe“ when a newer one applies, with no
    yearly check to tick. Everything else keeps the check, shown as „Geprüft
    am …“ or „Prüfung fällig“, and the list filters by these.
  - >
    When a newer edition of a norm your office holds comes into force, whoever
    manages the Büroablage finds it in the Postfach, with the projects whose
    reference day falls after it.
