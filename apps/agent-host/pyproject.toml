[build-system]
requires = ["setuptools>=84.2.1", "setuptools-scm>=10.3.4"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-host"
version = "0.1.0"
description = "Piloti backend host: the chat runtime, the knowledge and job APIs, and the workers"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = {text = "Apache-2.0"}
authors = [
    {name = "Grid Agent Contributors"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastapi>=0.161.1",
    "sqlalchemy>=2.0.51",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.0.0",
    "langchain-core>=1.3.3,<2",
    "python-multipart>=0.0.27,<0.1",
    # JWT validation for AuthMiddleware (RS256 via JWKS). The extra is `crypto`;
    # PyJWT has no `cryptography` extra, so that spelling installed nothing.
    # 2.15.1 is the first release clear of the September 2026 advisories.
    "PyJWT[crypto]>=2.15.1",
    # Outlook archives (.pst/.ost) for the mail import (ADR-0085). libpff is the
    # only reader that covers ANSI, Unicode and OST archives and reads from a
    # file object; 20260926 is the first release with cp314 wheels, so no
    # compiler reaches the image. LGPL-3.0-or-later, used unmodified as a library.
    "libpff-python==20260926",
    # RTF bodies (most of an Exchange mailbox) as text. Pure Python, BSD-3.
    "striprtf==0.0.33",
    # HTML bodies as text, and range reads of the staged archive. Both already
    # in the environment through the agent; named here because this package
    # imports them.
    "lxml>=6.1.0,<7",
    "httpx>=0.28",
    # DXF drawings to their PDF rendition (ADR-0152): ezdxf reads the file and
    # draws it, matplotlib writes the vector PDF. Both pure Python as far as this
    # image is concerned (MIT, PSF); matplotlib was already here through the
    # agent runtime's profiler and is named so it does not leave with it.
    # ezdxf's own PDF backend needs PyMuPDF, which is AGPL, and is not used.
    "ezdxf>=1.4.5,<2",
    "matplotlib>=3.10",
    # The brand's type ships as WOFF2 (packages/brand/fonts); fontTools needs brotli to
    # unpack it for the PDF. Google's reference implementation, MIT.
    "brotli>=1.1",
    # A Katastralmappe stores no parcel as a polygon (BEV spec §3.2): the parcels and
    # their areas are rebuilt from its boundary network with GEOS (BSD, wheels bundle it).
    "shapely>=2.1",
    # Inbound mail (`agent_host.mail`): the reply and quote split and the
    # signature cut, German and English rules. MIT, pure Python, no
    # dependencies; pinned because its rules are what the review shows.
    "mail-parser-reply==1.36",
    # Calendar invites in inbound mail. BSD-2-Clause, pure Python; brings
    # python-dateutil and tzdata (Europe/Vienna without the system zone files).
    "icalendar==7.3.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.3.6",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.21.0",
    "psycopg[binary]>=3.3.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The brand's type and name, copied here by `node packages/brand/sync.mjs`; the DXF sheet
# reads them (`agent_host.drawings.house_style`, ADR-0152).
"agent_host.drawings" = ["brand/identity.json", "brand/fonts/*.woff2"]

[project.entry-points."nat.plugins"]
agent_host = "agent_host.register"

# The WorkOS validator, the one this deployment uses. Still an entry point
# rather than an import (ADR-0002): another package can add its own.
[project.entry-points."agent_host.validators"]
workos = "agent_host.auth.workos_validator:get_validators"
