[build-system]
requires = ["setuptools>=84.2.1", "setuptools-scm>=10.3.4"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-host"
version = "0.1.0"
description = "Piloti backend host: the chat runtime, the knowledge and job APIs, and the workers"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = {text = "Apache-2.0"}
authors = [
    {name = "Grid Agent Contributors"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastapi>=0.161.1",
    "sqlalchemy>=2.0.51",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.0.0",
    "langchain-core>=1.3.3,<2",
    "python-multipart>=0.0.27,<0.1",
    "PyJWT[crypto]>=2.15.1",
    "libpff-python==20260926",
    "striprtf==0.0.33",
    "lxml>=6.1.0,<7",
    "httpx>=0.28",
    "ezdxf>=1.4.5,<2",
    "matplotlib>=3.10",
    "brotli>=1.1",
    "shapely>=2.1",
    "mail-parser-reply==1.36",
    "icalendar==7.3.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.3.6",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.21.0",
    "psycopg[binary]>=3.3.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agent_host.drawings" = ["brand/identity.json", "brand/fonts/*.woff2"]

[project.entry-points."nat.plugins"]
agent_host = "agent_host.register"

[project.entry-points."agent_host.validators"]
workos = "agent_host.auth.workos_validator:get_validators"
