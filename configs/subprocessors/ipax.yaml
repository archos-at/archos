    Die Server und die nächtlichen Velero-Kopien jedes Volumes liegen bei IPAX. Eine Projektlöschung erreicht die
    Datenbank, den Objektspeicher und den Vektorindex; die Kopien altern nach 30 Tagen aus. Einen Löschlauf für eine
