id: openrouter
kind: processor
status: active
order: 20
name: OpenRouter, Inc.
entity_country: US
processing_countries: [US]
transfer: third_country
contract: unknown
data_classes: [model_io, tenant_content]
purposes: [service_provision, quality_evaluation]
holds_tenant_text: true
deletion:
  status: partial
  de: >-
    Auf dem Schlüssel der Plattform läuft jede Anfrage mit Zero Data Retention: weder OpenRouter noch der
    Modellanbieter speichern Inhalte, es bleibt nichts zu löschen. Schaltet eine Organisation Zero Data Retention ab
    oder bringt sie einen eigenen Schlüssel mit, gelten die Aufbewahrungsregeln des Anbieters; eine Löschung bei
    Vertragsende erreicht diese Kopien nicht.
  en: >-
    On the platform's key every request runs with zero data retention: neither OpenRouter nor the model provider
    keeps content, so nothing is left to delete. Where an organization switches zero data retention off or brings its
    own key, the provider's retention applies, and deletion at contract end does not reach those copies.
hosts: [openrouter.ai, eu.openrouter.ai]
env:
  - OPENROUTER_INGEST_API_KEY
  - OPENROUTER_RESEARCH_API_KEY
  - LLM_API_KEY
  - DECISIONS_URL
  - DECISIONS_API_KEY
  - SKILL_REVIEW_LLM_API_KEY
  - OPENROUTER_API_KEY
  - OPENROUTER_BASE_URL
  - OPENROUTER_HOST
  - LLM_BASE_URL
  - EMBED_API_KEY
  - EMBED_BASE_URL
  - VLM_API_KEY
  - VLM_BASE_URL
  - RERANKER_API_KEY
  - RERANKER_BASE_URL
  - SUMMARY_LLM_API_KEY
  - SUMMARY_LLM_BASE_URL
  - CONSISTENCY_LLM_API_KEY
  - CONSISTENCY_LLM_BASE_URL
  - BACKFILL_SUMMARY_API_KEY
  - BACKFILL_SUMMARY_BASE_URL
  - SKILL_REVIEW_LLM_BASE_URL
  - AIQ_EMBED_API_KEY
  - AIQ_EMBED_BASE_URL
  - AIQ_VLM_API_KEY
  - AIQ_VLM_BASE_URL
  - AIQ_RERANKER_API_KEY
  - AIQ_RERANKER_BASE_URL
  - GRID_EMBED_API_KEY
  - GRID_EMBED_BASE_URL
  - GRID_VLM_API_KEY
  - GRID_VLM_BASE_URL
  - GRID_RERANKER_API_KEY
  - GRID_RERANKER_BASE_URL
