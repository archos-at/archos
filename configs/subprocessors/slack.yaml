deletion:
  status: gap
  de: >-
    Hinweise zu Rückmeldungen tragen Ticketnummer, Art, Deployment, Name der Organisation und Links, keinen Text einer
    Rückmeldung oder eines Chats. Fehlermeldungen tragen den Titel des Fehlers, also die Fehlermeldung selbst, die den
    Namen eines Dokuments oder Projekts enthalten kann. Alles bleibt nach der Aufbewahrung des Slack-Workspace; eine
    Löschung bei Vertragsende erreicht es nicht.
  en: >-
    Notices about reports carry the ticket number, kind, deployment, the organization's name and links, no text of a
    report or a chat. Error alerts carry the issue's title, which is the exception message and can name a document or
    a project. Everything stays under the Slack workspace's retention; deletion at contract end does not reach it.
