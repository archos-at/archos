  - apps/agent-host/src/agent_host/routes/dictation.py
copy:
  name:
    de: OpenAI, Inc. (direkt)
    en: OpenAI, Inc. (direct)
  purpose:
    de: Nur mit einem eigenen OpenAI-Schlüssel Ihrer Organisation (BYOK) oder einer abweichenden Konfiguration des Betreibers
    en: Only with your organization's own OpenAI key (BYOK) or an operator configuration that points there
  data:
    de: Gleiche Inhalte wie OpenRouter (siehe oben), einschließlich Audio von Diktaten
    en: The same content OpenRouter receives (see above), including dictation audio
  location:
    de: USA
    en: USA
  required:
