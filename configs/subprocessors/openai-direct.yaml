id: openai-direct
kind: processor
status: conditional
order: 100
name: OpenAI, L.L.C. (direct)
entity_country: US
processing_countries: [US]
transfer: third_country
contract: unknown
data_classes: [model_io, voice_audio]
purposes: [service_provision]
holds_tenant_text: true
deletion:
  status: controller_designated
  de: >-
    Nur erreicht, wenn eine Organisation einen eigenen OpenAI-Schlüssel hinterlegt oder der Betreiber eine
    Basis-URL auf api.openai.com setzt; dann gelten OpenAIs Aufbewahrungsregeln unter dem Vertrag des
    Schlüsselinhabers.
  en: >-
    Reached only when an organization stores its own OpenAI key or the operator sets a base URL to api.openai.com; then
    OpenAI's retention applies under the key holder's contract.
hosts: [api.openai.com]
env: [OPENAI_API_KEY]
