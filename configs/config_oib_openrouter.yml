general:
  use_uvloop: true
  telemetry:
    logging:
      console:
        _type: console
        level: INFO
      otlp:
        _type: otelcollector_logs
        endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
        level: INFO
    tracing:
      otelcollector_redaction:
        _type: otelcollector_redaction
        project: ${OTEL_SERVICE_NAME:-backend-chat}
        endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
        resource_attributes:
          deployment.environment: ${APP_ENV:-production}

  front_end:
    _type: agent_host
    runner_class: agent_host.plugin.AgentHostWorker
    db_url: ${NAT_JOB_STORE_DB_URL:-sqlite+aiosqlite:///./jobs.db}
    expiry_seconds: 86400
    cors:
      allow_origin_regex: '${CORS_ALLOW_ORIGIN_REGEX:-http://localhost(:\d+)?|http://127.0.0.1(:\d+)?}'
      allow_methods:
        - GET
        - POST
        - DELETE
        - OPTIONS
      allow_headers:
        - "*"
      allow_credentials: true
      expose_headers:
        - "*"

# model_name is the boot floor only: Platform → Models picks the live model, except for summary_llm and rerank_llm.
llms:
  research_llm:
    _type: openai
    model_name: ${DEFAULT_MODEL:-openai/gpt-6-luna}
    base_url: "${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}"
    api_key: ${OPENROUTER_API_KEY}
    temperature: 1.0
    top_p: 0.95
    max_tokens: 65536
    max_retries: 2
    request_timeout: 120
    reasoning_effort: medium
    api_type: chat_completion

  clarifier_llm:
    _type: openai
    model_name: ${DEFAULT_MODEL:-openai/gpt-6-luna}
    base_url: "${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}"
    api_key: ${OPENROUTER_API_KEY}
    temperature: 1.0
    top_p: 0.95
    max_tokens: 65536
    max_retries: 2
    request_timeout: 120
    reasoning_effort: medium

  deep_orchestrator_llm:
    _type: openai
    model_name: ${DEFAULT_MODEL:-openai/gpt-6-luna}
    base_url: "${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}"
    api_key: ${OPENROUTER_API_KEY}
    temperature: 1.0
    top_p: 0.95
    max_tokens: 128000
    max_retries: 1
    request_timeout: 600
    reasoning_effort: medium

  deep_planner_llm:
    _type: openai
    model_name: ${DEFAULT_MODEL:-openai/gpt-6-luna}
    base_url: "${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}"
    api_key: ${OPENROUTER_API_KEY}
    temperature: 1.0
    top_p: 0.95
    max_tokens: 128000
    max_retries: 2
    request_timeout: 180
    reasoning_effort: medium

  deep_researcher_llm:
    _type: openai
    model_name: ${DEFAULT_MODEL:-openai/gpt-6-luna}
    base_url: "${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}"
    api_key: ${OPENROUTER_API_KEY}
    temperature: 1.0
    top_p: 0.95
    max_tokens: 65536
    max_retries: 2
    request_timeout: 120
    reasoning_effort: medium

  deep_router_llm:
    _type: openai
    model_name: ${DEFAULT_MODEL:-openai/gpt-6-luna}
    base_url: "${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}"
    api_key: ${OPENROUTER_API_KEY}
    temperature: 1.0
    top_p: 0.95
    max_tokens: 8192
    max_retries: 2
    request_timeout: 60
    reasoning_effort: medium

  ris_planner_llm:
    _type: openai
    model_name: ${DEFAULT_MODEL:-openai/gpt-6-luna}
    base_url: "${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}"
    api_key: ${OPENROUTER_API_KEY}
    temperature: 1.0
    top_p: 0.95
    max_tokens: 8192
    max_retries: 2
    request_timeout: 60
    reasoning_effort: none

  card_llm:
    _type: openai
    model_name: ${DEFAULT_MODEL:-openai/gpt-6-luna}
    base_url: "${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}"
    api_key: ${OPENROUTER_API_KEY}
    temperature: 1.0
    top_p: 0.95
    max_tokens: 65536
    max_retries: 2
    request_timeout: 120
    reasoning_effort: medium

  follow_ups_llm:
    _type: openai
    model_name: ${DEFAULT_MODEL:-openai/gpt-6-luna}
    base_url: "${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}"
    api_key: ${OPENROUTER_API_KEY}
    temperature: 1.0
    top_p: 0.95
    max_tokens: 1024
    max_retries: 1
    request_timeout: 15
    reasoning_effort: none

  summary_llm:
    _type: openai
    model_name: ${DEFAULT_MODEL:-openai/gpt-6-luna}
    base_url: "${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}"
    api_key: ${OPENROUTER_API_KEY}
    temperature: 1.0
    top_p: 0.95
    max_tokens: 100
    max_retries: 2
    request_timeout: 30
    reasoning_effort: none

  rerank_llm:
    _type: openai
    model_name: ${DEFAULT_MODEL:-openai/gpt-6-luna}
    base_url: "${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}"
    api_key: ${OPENROUTER_API_KEY}
    temperature: 0
    seed: 1
    top_p: 1.0
    max_tokens: 2048
    max_retries: 0
    request_timeout: 25
    reasoning_effort: none

function_groups:
  canvas:
    _type: document_canvas

  workspace:
    _type: workspace_tools

functions:
  data_sources:
    _type: data_source_registry
    sources:
      - id: web_search
        name: "Web Search"
        description: "Search the web for real-time information."
        tools:
          - web_search_tool
          - advanced_web_search_tool
      - id: knowledge_layer
        name: "Knowledge Base"
        description: "Search uploaded documents and files."
        tools:
          - knowledge_search
          - read_passage
          - list_files
          - project_lookup
      - id: ris
        name: "RIS – Österreichisches Recht"
        description: "Search Austrian federal/state law and case law in the official RIS (Rechtsinformationssystem des Bundes) and fetch entire documents on demand."
        tools:
          - law_lookup
          - ris_search_tool
          - ris_fetch_tool
          - ris_catalog_lookup_tool

  web_search_tool:
    _type: tavily_web_search
    max_results: 8
    max_content_length: 1000
    exclude_domains:
      - ris.bka.gv.at

  advanced_web_search_tool:
    _type: tavily_web_search
    max_results: 4
    advanced_search: true
    exclude_domains:
      - ris.bka.gv.at

  ris_search_tool:
    _type: ris_search
    page_size: 20
    max_results: 20
    planner_llm: ris_planner_llm

  ris_fetch_tool:
    _type: ris_fetch_document
    max_chars: 40000
    ingest_into_knowledge: true

  law_lookup:
    _type: law_lookup
    source: at-ris
    tool_name: law_lookup
    planner_llm: ris_planner_llm
    ingest_into_knowledge: true

  ris_catalog_lookup_tool:
    _type: ris_catalog_lookup
    max_matches: 8

  look:
    _type: look

  show_in_viewer:
    _type: show_in_viewer

  knowledge_search:
    _type: knowledge_retrieval
    collection_name: ${COLLECTION_NAME:-oib_knowledge}
    include_base_collection: true
    include_session_collection: true
    project_collections: []
    exclude_file_names:
      - aenderungen_oib-rl_1_ausgabe_mai_2023.pdf
      - aenderungen_oib-rl_1_leitfaden_ausgabe_mai_2023.pdf
      - aenderungen_oib-rl_2.1_ausgabe_mai_2023.pdf
      - aenderungen_oib-rl_2.2_ausgabe_mai_2023.pdf
      - aenderungen_oib-richtlinie_2.2_ausgabe_mai_2023.pdf  # the name oib.or.at publishes 2.2 under
      - aenderungen_oib-rl_2.3_ausgabe_mai_2023.pdf
      - aenderungen_oib-rl_2_ausgabe_mai_2023.pdf
      - aenderungen_oib-rl_2_leitfaden_ausgabe_mai_2023.pdf
      - aenderungen_oib-rl_3_ausgabe_mai_2023.pdf
      - aenderungen_oib-rl_4_ausgabe_mai_2023.pdf
      - aenderungen_oib-rl_5_ausgabe_mai_2023.pdf
      - aenderungen_oib-rl_6-leitfaden_ausgabe_mai_2023.pdf
      - aenderungen_oib-rl_6_ausgabe_mai_2023.pdf
      - aenderungen_oib-rl_begriffsbestimmungen_ausgabe_mai_2023.pdf
      - aenderungen_oib-rl_zitierte_normen_und_sonstige_technische_regelwerke_ausgabe_mai_2023.pdf
      - aenderungen_oib-rl_zitierte_normen_und_sonstige_technische_regelwerke_ausgabe_mai_2023_rev.1.pdf
      - oib-rl_zitierte_normen_und_sonstige_technische_regelwerke_ausgabe_mai_2023.pdf
      - oib-rl-1-aenderungen-gegenueber-version-2015.pdf
      - oib-rl-2-aenderungen-gegenueber-version-2015.pdf
      - oib-rl-2.1-aenderungen-gegenueber-version-2015.pdf
      - oib-rl-2.2-aenderungen-gegenueber-version-2015.pdf
      - oib-rl-2.3-aenderungen-gegenueber-version-2015.pdf
      - oib-rl-3-aenderungen-gegenueber-version-2015.pdf
      - oib-rl-4-aenderungen-gegenueber-version-2015.pdf
      - oib-rl-5-aenderungen-gegenueber-version-2015.pdf
      - oib-rl-6-aenderungen-gegenueber-version-2015.pdf
      - oib-rl-6-aenderungen-gegenueber-version-2011.pdf
      - aenderungen_oib-rl_6_september_2025.pdf
    generate_summary: true
    summary_model: summary_llm
    summary_db: ${SUMMARY_DB:-sqlite+aiosqlite:///./summaries.db}
    top_k: 16
    max_chunks_per_document: 5
    rerank_llm: rerank_llm
    rerank_candidates: 60
    reranker_provider: openrouter
    requery_llm: rerank_llm
    requery_max_queries: 2
    requery_decider: jev
    decision_sufficiency_threshold: 0.55

  read_passage:
    _type: read_passage
    knowledge_search: knowledge_search

  list_files:
    _type: list_files
    knowledge_search: knowledge_search

  remember:
    _type: project_memory_remember
    judge_llm: card_llm

  emit_card:
    _type: emit_card

  ask_user:
    _type: ask_user

  describe_card:
    _type: describe_card

  surface_documents:
    _type: surface_documents

  propose_file_change:
    _type: propose_file_change

  file_draft:
    _type: file_draft

  execute:
    _type: execute
    runner_url: ${CODE_RUNNER_URL:-}

  create_task:
    _type: create_task

  project_lookup:
    _type: project_lookup

  ifc_query:
    _type: ifc_query
    default_limit: 25

  ifc_measure:
    _type: ifc_measure
    default_limit: 50

  dxf_measure:
    _type: dxf_measure

  # Stored turns persist this function name as functionName: renaming it splits history.
  shallow_research_agent:
    _type: research_agent
    llm: research_llm
    filesystem: knowledge_search
    tools:
      - web_search_tool
      - knowledge_search
      - list_files
      - look
      - show_in_viewer
      - law_lookup
      - remember
      - surface_documents
      - propose_file_change
      - file_draft
      - execute
      - create_task
      - project_lookup
      - canvas
      - workspace
      - ifc_query
      - ifc_measure
      - dxf_measure
      - ask_user
    verbose: true
    max_tool_iterations: 7
    max_input_tokens_per_turn: 600000
    max_calls_per_round: 12
    repair_pass: true
    card_repair_llm: card_llm
    claim_judge_llm: follow_ups_llm
    skills_enabled: true
    turn_decisions: true
    skill_allowlist: []

  deep_research_skills:
    _type: deep_research_skills
    agents:
      researcher-agent: [oib, bim]
      writer-agent: [synthesis]

  deep_research_agent:
    _type: deep_research_agent
    enable_citation_verification: true
    orchestrator_llm: deep_orchestrator_llm
    source_router_llm: deep_router_llm
    researcher_llm: deep_researcher_llm
    planner_llm: deep_planner_llm
    writer_llm: deep_orchestrator_llm
    skills: deep_research_skills
    tools:
      - knowledge_search
      - read_passage
      - list_files
      - look
      - ris_search_tool
      - ris_fetch_tool
      - ris_catalog_lookup_tool
      - advanced_web_search_tool
      - remember
      - emit_card
      - surface_documents
      - ifc_query
      - ifc_measure
      - dxf_measure
    verbose: true
    checkpoint_db: ${DEEP_CHECKPOINT_DB:-}

  project_intake_agent:
    _type: project_intake_agent
    llm: research_llm
    tools:
      - list_files
      - knowledge_search
      - read_passage
    max_tool_steps: 80
    max_run_seconds: 1200

workflow:
  _type: chat_deepresearcher_agent
  verbose: true
  max_history_tokens: 40000
  enable_clarifier: true
  clarifier:
    llm: clarifier_llm
    planner_llm: clarifier_llm
    max_turns: 3
    enable_plan_approval: true
    log_response_max_chars: 2000
    verbose: true
  use_async_deep_research: true
  checkpoint_db: ${CHECKPOINT_DB:-./checkpoints.db}
  memory_reflection_llm: card_llm
  follow_ups_llm: follow_ups_llm
