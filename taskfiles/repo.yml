version: '3'

tasks:
  agents:setup:
    desc: Publish every skill in apm.yml into the harness directories it targets
    cmds:
      - uvx --from apm-cli=={{.APM_VERSION}} apm install --frozen
      - task: agents:browser

  agents:browser:
    desc: Install agent-browser at the pinned version and run its doctor
    cmds:
      - |
        have=$(agent-browser --version 2>/dev/null | awk '{print $NF}' || true)
        if [ "$have" != "{{.AGENT_BROWSER_VERSION}}" ]; then
          npm i -g agent-browser@{{.AGENT_BROWSER_VERSION}}
        fi
      - agent-browser doctor || true

  agents:audit:
    desc: Fail when apm.lock.yaml is stale against skills/, or the deployed skills have drifted
    cmds:
      - |
        before=$(sha256sum apm.lock.yaml | cut -d' ' -f1)
        uvx --from apm-cli=={{.APM_VERSION}} apm install --frozen
        after=$(sha256sum apm.lock.yaml | cut -d' ' -f1)
        if [ "$before" != "$after" ]; then
          echo ''
          echo 'task agents:audit: apm.lock.yaml was stale against skills/.'
          echo 'It has just been rewritten to match. COMMIT apm.lock.yaml.'
          exit 1
        fi
        report=$(uvx --from apm-cli=={{.APM_VERSION}} apm audit 2>&1) || true
        printf '%s\n' "$report"
        case "$report" in
          *"No drift detected"*) ;;
          *)
            echo ''
            echo 'task agents:audit: the deployed skills do not match apm.lock.yaml.'
            echo 'Something edited .claude/ or .agents/ directly; those are generated.'
            echo 'Fix the source under skills/, then re-run `task agents:setup`.'
            exit 1
            ;;
        esac

  agents:update:
    desc: Refresh agent-skill pins in apm.yml, then review the diff before committing
    cmds:
      - uvx --from apm-cli=={{.APM_VERSION}} apm update --yes

  release:note:
    desc: 'Start a release note for the change you are making: task release:note -- <slug>'
    cmds:
      - '{{.RENO}} new {{.CLI_ARGS}}'

  release:lint:
    desc: Check the release notes against the house rules, then reno's own lint (CI runs this on every PR)
    cmds:
      - task: release:lint:house
      - ci/unshallow.sh
      - '{{.RENO}} lint .'

  release:lint:house:
    desc: The house rules alone, on the notes as published prose (needs no git history)
    cmds:
      - '{{.RELNOTES}} lint'

  release:preview:
    desc: reno's own report — the notes grouped by the release they shipped in
    cmds:
      - '{{.RENO}} report .'

  release:week:
    desc: 'One week''s customer notes by area, to write its public summary from: task release:week -- 2026-W44'
    cmds:
      - '{{.RELNOTES}} week {{.CLI_ARGS}}'

  release:changelog:
    desc: Regenerate the public changelog (website) and the customer list (app) from the notes
    cmds:
      - '{{.RELNOTES}} publish {{.CLI_ARGS}}'

  baselines:tighten:
    desc: Lower every shrink-only ratchet baseline to the tree, so a gain cannot be spent again
    cmds:
      - for: [check_file_size, check_nesting, check_comments, check_brand_names, check_brand_prose, check_country_in_code]
        cmd: '{{.VENV_BIN}}/python{{.EXE}} scripts/{{.ITEM}}.py --update'

  lint:repo:
    desc: pre-commit across the whole repo, plus the agent-skill lockfile — the same scope CI lints
    cmds:
      - '{{.VENV_BIN}}/pre-commit{{.EXE}} run --all-files'
      - task: agents:audit

  local:up:
    desc: 'Start the whole app locally (Postgres, Redis, fake WorkOS, backend api + chat, UI) and migrate; open http://localhost:3000 with `task local:session`'
    cmds:
      - bash scripts/local-stack/local-stack.sh up

  local:down:
    desc: Stop everything `local:up` started (the data directory stays)
    cmds:
      - bash scripts/local-stack/local-stack.sh down

  local:status:
    desc: Which process of the local stack runs, on which port, and where its logs are
    cmds:
      - bash scripts/local-stack/local-stack.sh status

  local:session:
    desc: 'Print a `wos-session` cookie value for a local user (`-- anna` or `-- bert`) to put in a browser or a curl call'
    cmds:
      - bash scripts/local-stack/local-stack.sh session {{.CLI_ARGS}}

  local:smoke:
    desc: 'Browser check of a running local stack: anna adds a memory note, bert sees none (Playwright)'
    cmds:
      - bash scripts/local-stack/local-stack.sh smoke
