# The website's CMS (apps/cms: Payload, ADR-0155): its checks, its Postgres
# suite, a local instance, the import of the git-era posts, and the social hand-off.
#
# Included by the root Taskfile.yml with `flatten: true`. Every task that writes
# defaults to a dry run; nothing here touches a deployed CMS unless CMS_URL and a
# key for it, or a DATABASE_URL, are set by hand.

version: '3'

tasks:
  cms:install:
    desc: Install the CMS's dependencies
    dir: '{{.CMS}}'
    cmds:
      - bun install --frozen-lockfile

  cms:check:
    desc: The CMS's typecheck and lint
    dir: '{{.CMS}}'
    cmds:
      - bun run typecheck
      - bun run lint

  cms:test:
    desc: The CMS's unit tests - the review rules, the MDX import, the social hand-off, the choices held to the website's code
    dir: '{{.CMS}}'
    cmds:
      - bun run test

  cms:test:db:
    desc: Migrate a throwaway Postgres, check the config against the migrations, run the review rules through Payload's operations (needs PostgreSQL server binaries)
    dir: '{{.CMS}}'
    cmds:
      - bash scripts/test-db.sh

  cms:build:
    desc: Production build of the CMS (Next's standalone output, what the image runs)
    dir: '{{.CMS}}'
    env:
      PAYLOAD_SECRET: build-only
    cmds:
      - bun run build

  cms:verify:
    desc: Everything CI runs for the CMS
    cmds:
      - task: cms:install
      - task: cms:check
      - task: cms:test
      - task: cms:test:db

  cms:dev:
    desc: The CMS on http://localhost:3100 against a throwaway Postgres (gone when you stop it); admin@example.com / local-admin-password
    dir: '{{.CMS}}'
    env:
      CMS_ADMIN_EMAIL: admin@example.com
      CMS_ADMIN_PASSWORD: local-admin-password
      CMS_WEBSITE_API_KEY: local-website-key
      WEBSITE_REVALIDATE_URL: http://localhost:4321/api/cms/revalidate
      WEBSITE_REVALIDATE_TOKEN: local-revalidate-token
      WEBSITE_PUBLIC_URL: http://localhost:4321
      CMS_PREVIEW_SECRET: local-preview-secret
    cmds:
      - bash scripts/test-db.sh -- sh -c 'npx --no-install payload migrate && npx --no-install next dev --port 3100'

  cms:up:
    desc: Start the CMS and its Postgres locally (the `cms` profile of deploy/compose), kept across restarts
    dir: deploy/compose
    cmds:
      - docker compose --env-file ../.env -f docker-compose.yaml --profile cms up -d --build cms

  cms:import:
    desc: Import apps/website/src/content/blog into the CMS at DATABASE_URL (dry run; `-- apply` writes)
    dir: '{{.CMS}}'
    cmds:
      - bun run import:blog {{.CLI_ARGS}}

  cms:social:handoff:
    desc: Show what each approved social post would be sent to Buffer as (dry run; `-- --apply` sends, with BUFFER_API_KEY)
    dir: '{{.CMS}}'
    cmds:
      - node social/handoff.mjs {{.CLI_ARGS}}
