version: '3'

tasks:
  workspace:install:
    desc: Install UI dependencies
    dir: '{{.UI}}'
    cmds:
      - bun install --frozen-lockfile

  workspace:build:jobs:
    desc: Bundle the bff-jobs slice entry into dist-jobs/slice.mjs, what `BFF_JOBS_MODE=inprocess` imports
    dir: '{{.UI}}'
    cmds:
      - bun run build:jobs

  workspace:a11y:
    desc: 'axe-core (WCAG 2.0 to 2.2 A and AA) over every /dev preview route, light and dark, 1440 and 390. Starts its own `next dev` (A11Y_BASE_URL uses a running one); `-- --shard 1/4` for a quarter; A11Y_CHROME overrides the browser. See scripts/a11y-audit.mjs'
    dir: '{{.UI}}'
    cmds:
      - bun run a11y {{.CLI_ARGS}}

  workspace:phone-audit:
    desc: 'Every /dev preview route at 390 and 360 with a touch screen: fails on a page wider than the phone and on a control under 44x44 not in ci/phone-audit-baseline.json. Starts its own `next dev` (PHONE_AUDIT_BASE_URL uses a running one); `-- --shard 1/4` for a quarter; `-- --write-baseline` records. See scripts/phone-audit.mjs'
    dir: '{{.UI}}'
    cmds:
      - bun run phone-audit {{.CLI_ARGS}}

  workspace:lint:
    desc: 'Lint the UI (oxlint, the repo rules included as a JS plugin) and its module seams (dependency-cruiser). CI: task workspace:lint -- --format=github'
    dir: '{{.UI}}'
    cmds:
      - bun run lint {{.CLI_ARGS}}
      - bun run lint:seams

  workspace:types:
    desc: Typecheck the UI, specs included (next build checks production code only)
    dir: '{{.UI}}'
    cmds:
      - bun run type-check {{.CLI_ARGS}}

  workspace:blast-radius:
    desc: 'Hold each hub module to the specs it reached when recorded (-- --update rewrites the baseline, -- --top 30 lists the widest)'
    dir: '{{.UI}}'
    cmds:
      - node scripts/blast-radius.mjs {{.CLI_ARGS}}

  workspace:test:
    desc: Run the UI test suite
    dir: '{{.UI}}'
    cmds:
      - bun run test

  workspace:test:coverage:
    desc: UI tests with line coverage (text and lcov, under apps/workspace/coverage)
    dir: '{{.UI}}'
    cmds:
      - bun run test:coverage

  db:test:rls:
    desc: >-
      Tenant-isolation suite against a throwaway Postgres, connected as the
      restricted runtime role (ADR-0041). Needs PostgreSQL server binaries.
    cmds:
      - bash scripts/rls-test-db.sh

  workspace:search:latency:
    desc: >-
      Measure the workspace search's documents SQL over a seeded office (60,000
      documents, three organizations) as the runtime role under RLS. Prints
      p50/p95 per query; a measurement, not a gate. Needs PostgreSQL server binaries.
    cmds:
      - SEARCH_LATENCY=1 bash scripts/rls-test-db.sh --only bff/search/search-latency.integration.spec.ts

  workspace:register:spike:
    desc: >-
      Import the whole BEV address register into a throwaway Postgres and resolve
      200 of its addresses typed seven ways (ADR-0172). Prints the rates; a
      measurement, not a gate. Needs PostgreSQL server binaries and
      REGISTER_ARCHIVE, the path of the BEV relational tables' zip.
    cmds:
      - bash scripts/rls-test-db.sh --only bff/site-resolution/register-spike.integration.spec.ts

  workspace:test:shard:
    desc: 'One shard of the UI suite, split by recorded time (CI: SHARD=1/8 task workspace:test:shard)'
    dir: '{{.UI}}'
    requires:
      vars: [SHARD]
    vars:
      WORKERS:
        sh: echo "${PYTEST_XDIST_AUTO_NUM_WORKERS:-$(nproc)}"
    cmds:
      - bun run test:specs --parallel={{.WORKERS}} --shard={{.SHARD}} --timings=tests/test-timings.json
      - cmd: bun run test:rules
        if: '[ "{{index (splitList "/" .SHARD) 0}}" = 1 ]'

  workspace:test:durations:
    desc: Re-record the per-file times the UI shards split by (tests/test-timings.json)
    dir: '{{.UI}}'
    cmds:
      - rm -rf .timings && mkdir .timings
      - for: ['1', '2', '3', '4', '5', '6', '7', '8']
        cmd: >-
          echo '{"version":1,"files":{}}' > .timings/{{.ITEM}}.json &&
          bun run test:specs --parallel --shard={{.ITEM}}/8
          --timings=.timings/{{.ITEM}}.json --timings=tests/test-timings.json --update-timings
      - node scripts/merge-test-timings.mjs .timings tests/test-timings.json
      - rm -rf .timings

  workspace:test:related:
    desc: 'One shard of the UI specs that reach the given files (CI on a pull request: SHARD=1/8 FILES="...")'
    dir: '{{.UI}}'
    requires:
      vars: [SHARD, FILES]
    vars:
      WORKERS:
        sh: echo "${PYTEST_XDIST_AUTO_NUM_WORKERS:-$(nproc)}"
    cmds:
      - |
        specs=$(node scripts/related-specs.mjs {{range splitList " " .FILES}}{{shellQuote .}} {{end}})
        [ -z "$specs" ] || bun run test:specs --parallel={{.WORKERS}} --shard={{.SHARD}} --timings=tests/test-timings.json $(printf './%s ' $specs)
      - cmd: bun run test:rules
        if: '[ "{{index (splitList "/" .SHARD) 0}}" = 1 ] && printf "%s\n" {{range splitList " " .FILES}}{{shellQuote .}} {{end}} | grep -q "^eslint-rules/"'

  workspace:build:
    desc: Production build of the UI
    dir: '{{.UI}}'
    cmds:
      - bun run build

  workspace:provision:authz:
    desc: 'Check WorkOS authz drift against the catalog (add `-- --apply` to reconcile)'
    dir: '{{.UI}}'
    cmds:
      - bun run provision:authz {{.CLI_ARGS}}

  workspace:provision:audit-schemas:
    desc: 'Check WorkOS audit-log schema drift against the registry (add `-- --apply` to reconcile)'
    dir: '{{.UI}}'
    cmds:
      - bun run provision:audit-schemas {{.CLI_ARGS}}

  workspace:provision:flags:
    desc: 'Check every registry feature flag exists in WorkOS (read-only; needs WORKOS_API_KEY)'
    dir: '{{.UI}}'
    cmds:
      - bun scripts/check-workos-flags.ts

  workspace:provision:workos-env:
    desc: 'Check WorkOS environment identity drift (add `-- --apply` to reconcile)'
    dir: '{{.UI}}'
    cmds:
      - bun run provision:workos-env {{.CLI_ARGS}}

  workspace:cards:check:
    desc: The committed Zod card schema still matches contracts/cards/schemas.json
    cmds:
      - node apps/workspace/scripts/generate-card-schemas.mjs
      - git diff --exit-code -- apps/workspace/shared/cards/generated.ts

  workspace:verify:
    desc: Everything CI runs for the workspace tier
    cmds:
      - task: workspace:cards:check
      - task: workspace:lint
      - task: workspace:types
      - task: workspace:blast-radius
      - task: workspace:test:ci
      - task: workspace:build
