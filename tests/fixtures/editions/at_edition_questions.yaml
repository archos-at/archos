# The Austrian edition set: which OIB-RL edition binds, in which Land, on which day.
#
# Run it with `task be:eval:answer-suite -- --set editions` (every row) or
# `-- --set editions --only r3` (one group; ids work too). The checks are in
# scripts/turn_census/edition_eval.py, the requirements in
# docs/design/international/research/market-2026-11.md, section (d):
#
#   r1  9 Länder × OIB-RL 1–6 on 10.11.2026: edition, LGBl, in-force day, RIS link (R1)
#   r2  one Land and Richtlinie on both sides of a changeover day (R2); `pair` groups them
#   r3  a day or territory the records hold no edition for: abstain, quote nothing (R3)
#   r5  a false premise: wrong edition, another Land's instrument, a superseded one (R5)
#
# WHERE EVERY VALUE COMES FROM
# ----------------------------
# `relation` names the record in configs/knowledge-packs/at.json the expected
# values are read off: the edition's year, the LGBl in its `provision`, its
# `validFrom`. tests/test_edition_eval.py resolves every row against the pack, so
# a pack change that moves a value fails CI until this file follows it.
#
# Where RIS disagrees with the pack (and with the OIB table it was built from),
# RIS wins: the row carries `disputed_source` instead of `relation`, expects the
# RIS value, names the RIS document and quotes it, and keeps the pack's values
# under `pack`. The report counts disputed rows apart. The test holds `pack` to
# the pack too: when the pack is corrected, it fails and says to drop the dispute.
#
# An `expect` value the pack does not hold is left out, never filled from
# memory: the 2019 adoptions in Steiermark and Oberösterreich RL 6 name no LGBl.
#
#   edition        the year of the edition that binds that day („Ausgabe Mai 2023", „OIB-RL 6:2025")
#   other_edition  r2: the edition on the other side of the changeover, which the answer names too
#   lgbl           the Landesgesetzblatt number that makes it binding („LGBl. Nr. 83/2026")
#   in_force       the day that relation took effect, ISO; any common German date form matches
#   ris_link       a link to ris.bka.gv.at
#   abstain        no OIB-RL passage cited (`no_substitute`) and the judge reads an abstention (`abstains`)
#   premise        r5: the false part of the question; the judge reads a correction (`corrects_premise`)

