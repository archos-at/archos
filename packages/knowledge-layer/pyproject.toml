[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=84.2.1", "setuptools-scm>=10.3.4"]

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "knowledge-layer"
version = "1.0.0"
description = "Piloti's knowledge layer: reads the office's documents and the legal corpus, and finds the passages Piloti cites"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = {text = "Apache-2.0"}
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "boto3>=1.43.118",
    "regex>=2026.5.9",
]

[project.optional-dependencies]
llamaindex = [
    "llama-index>=0.14.23",
    "llama-index-embeddings-nvidia>=0.1.0",
    "qdrant-client>=1.19.1,<2",
    "pdfplumber>=0.11.10",
    "pypdfium2>=5.12.1",
    "Pillow>=9.0.0",
    "openai>=2.53.0",
    "openpyxl>=3.1",
    "python-pptx>=0.6.21",
]
all = [
    "knowledge-layer[llamaindex]",
]

[project.entry-points."nat.plugins"]
knowledge_layer = "knowledge_layer.register"
knowledge_layer_browse = "knowledge_layer.browse.tool"
knowledge_layer_read_passage = "knowledge_layer.read_passage.tool"
