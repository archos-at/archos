[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=84.2.1", "setuptools-scm>=10.3.4"]

[tool.setuptools]
# Subpackages are named too: an explicit `packages` list does not recurse.
packages = ["public_sources", "public_sources.access", "public_sources.engines"]
package-dir = {"public_sources" = "src"}

[project]
name = "public-sources"
version = "0.1.0"
description = "Public legal and geodata sources as configured records: protocol access types, format engines, a sandboxed fetcher and deterministic change monitors"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = {text = "Apache-2.0"}
dependencies = [
    "httpx>=0.24.0",
    "httpcore>=1.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "lxml>=6.1.0",
    "beautifulsoup4>=4.12.0",
    # A PDF's text is ingestion's text pass (knowledge_layer.ingest.pdf_text): one PDF pipeline.
    # Its two readers are an extra there, so they are named here with the same pins.
    "knowledge-layer",
    "pdfplumber>=0.11.10",
    "pypdfium2>=5.12.1",
    "starlette>=0.40.0",
    "uvicorn>=0.30.0",
]

[tool.uv.sources]
knowledge-layer = { workspace = true }
