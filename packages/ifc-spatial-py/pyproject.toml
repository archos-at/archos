[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ifc-spatial-py"
version = "0.1.0"
description = "Spike: the ifc-spatial operator surface on IfcOpenShell, with the answer contract intact"
readme = "COVERAGE.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "ifcopenshell==0.8.5",
  "numpy>=1.26",
  "shapely>=2.1.0",
  "pillow>=10.1",
]

[project.optional-dependencies]
ids = ["ifctester==0.8.5"]
dev = ["pytest>=8", "pytest-xdist>=3.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
