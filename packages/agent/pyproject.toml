[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=84.2.1", "setuptools-scm>=10.3.4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"agent.agents.deep_researcher" = ["skills/**/*"]
"agent.common" = ["identity.json"]

[project]
name = "agent"
version = "2.0.0"
description = "Piloti, the workspace for architects: the agent, its tools and the knowledge it reads"
requires-python = ">=3.14.1,<3.15"
license = {text = "Apache-2.0"}
dependencies = [
    "ezdxf>=1.4.5,<2",
    "shapely>=2.1",
    "nvidia-nat-core==1.9.0",
    "nvidia-nat[async-endpoints,phoenix,mcp]==1.9.0",
    "nvidia-nat-langchain[openai]==1.9.0",
    "nvidia-nat-eval==1.9.0",
    "nvidia-nat-profiler==1.9.0",
    "deepagents==0.7.32",
    "langgraph-checkpoint-postgres>=3.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-modal==0.0.7",
    "psycopg[binary]>=3.3.6",
    "asyncpg>=0.29.0",
    "redis>=5.0.0,<9",
    "aiosqlite>=0.19.0",
    "aiofiles>=23.0.0",
    "python-multipart>=0.0.27,<0.1",
    "knowledge-layer[all]",
    "public-sources",
    "langfuse>=4.15.3,<5",
    "cryptography>=50.0.0,<51",
    "pillow>=12.2.0,<14",
    "pygments>=2.20.0,<3",
    "a2ui-core==0.4.0",
    "langchain-openai>=1.6.6",
    "posthog>=7.59,<8",
    "py3langid>=0.4.0,<0.5",
    "validators>=0.35,<0.37",
    "hatchet-sdk[otel]==1.44.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-env>=1.8.1",
    "pre-commit>=3.5.0",
    "ruff~=0.17.2",
    "yapf>=0.40.0",
    "mypy>=2.3.0",
    "fakeredis[lua]>=2.40.0",
]
docs = [
    "sphinx>=7.0",
    "myst-parser>=3.0",
    "sphinx-copybutton>=0.5",
    "sphinx-mermaid>=0.0.8",
    "sphinx-rtd-theme>=2.0",
    "sphinx-autobuild>=2025.8.25",
    "nvidia-sphinx-theme>=0.0.9.post1",
    "sphinx-design>=0.7.0",
    "sphinxcontrib-mermaid>=2.0.3",
]
viz = [
    "pygraphviz>=2.0",
]

[project.entry-points."nat.plugins"]
researcher_conversation = "agent.core.conversation_register"
researcher = "agent.core.register"
deep_researcher = "agent.agents.deep_researcher.register"
data_source_registry = "agent.common.data_source_registry"
project_memory = "agent.memory.register"
cards = "agent.cards.register"
bim = "agent.tools.bim.register"
bim_measure = "agent.tools.bim.measure_register"
drawings = "agent.tools.drawings.register"
files = "agent.tools.files.register"
documents = "agent.tools.documents.register"
tasks = "agent.tools.tasks.register"
cross_project = "agent.tools.cross_project.register"
canvas = "agent.tools.canvas.register"
look = "agent.tools.look.register"
viewer = "agent.tools.viewer.register"
workspace = "agent.tools.workspace.register"
project_intake = "agent.agents.intake.register"
ris_lookup = "ris_adapter.lookup"
law_lookup = "agent.knowledge.law_lookup"
otel_logs = "agent.observability.otlp_logging_method"
otel_redaction = "agent.observability.otel_header_redaction_exporter"

[tool.uv.sources]
knowledge-layer = { workspace = true }
public-sources = { workspace = true }
