name: Setup Python env
description: Python + uv + a synced dev virtualenv (.venv), shared across jobs.

inputs:
  python-version:
    description: Python version to provision.
    required: false
    default: "3.14"

runs:
  using: composite
  steps:
    - name: Setup Python
      id: python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Setup uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true

    - name: Restore the synced venv
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ github.workspace }}-${{ hashFiles('uv.lock', 'pyproject.toml', '**/pyproject.toml') }}

    - name: Create venv and sync dev deps
      shell: bash
      env:
        PYTHON_VERSION: ${{ inputs.python-version }}
        UV_LINK_MODE: copy
      run: |
        [ -x .venv/bin/python ] || uv venv --python "$PYTHON_VERSION" .venv
        uv sync --group dev
