name: Setup Bun
description: >-
  Install Bun, the JavaScript toolchain: installer, script runner, bundler and
  type checker (`bun check`, ADR-0103). Node remains the runtime for both the
  app and the build — see the note below. This default is the repo's one Bun
  pin; tests/test_bun_version_pin.py holds the images and the session hook to it.

inputs:
  version:
    description: Bun version to install. Pinned so a runner change can't move the toolchain.
    required: false
    default: "1.4.3"

runs:
  using: composite
  steps:
    - name: Install Bun
      shell: bash
      env:
        BUN_VERSION: ${{ inputs.version }}
      run: |
        [ "$(bun --version 2>/dev/null)" = "$BUN_VERSION" ] || npm i -g "bun@${BUN_VERSION}"
