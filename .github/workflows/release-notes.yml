name: Release notes

on:
  push:
    branches: [develop]
    paths:
      - releasenotes/notes/**
      - releasenotes/config.yaml
      - releasenotes/summaries.yaml
      - scripts/release_notes*.py
      - .github/workflows/release-notes.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-notes
  cancel-in-progress: false

jobs:
  publish:
    name: Publish release notes to the app and the website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Regenerate both artifacts
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RELEASE_NOTES_TRANSLATION_MODEL: ${{ vars.RELEASE_NOTES_TRANSLATION_MODEL || 'openai/gpt-6-luna' }}
          REQUIRE: ${{ secrets.OPENROUTER_API_KEY != '' && '--require-translations' || '' }}
        run: uv run --no-project --with reno==4.1.0 python scripts/release_notes.py publish $REQUIRE

      - name: Commit and push
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RELEASE_NOTES_TRANSLATION_MODEL: ${{ vars.RELEASE_NOTES_TRANSLATION_MODEL || 'openai/gpt-6-luna' }}
          REQUIRE: ${{ secrets.OPENROUTER_API_KEY != '' && '--require-translations' || '' }}
        run: |
          set -euo pipefail
          files=(
            apps/website/src/data/changelog.json
            apps/workspace/bff/release-notes/release-notes.generated.json
            releasenotes/translations/
          )
          for attempt in 1 2 3 4; do
            git fetch -q origin develop
            # The artifacts are a function of the notes at the tip. When develop
            # has moved on (another merge, or the previous run's own changelog
            # commit), regenerate on top of it. Rebasing a generated file onto
            # another version of itself conflicts, and that conflict is how a
            # merge train used to leave this workflow red with nothing wrong.
            if [ "$(git rev-parse origin/develop)" != "$(git rev-parse HEAD)" ]; then
              git reset -q --hard origin/develop
              uv run --no-project --with reno==4.1.0 python scripts/release_notes.py publish $REQUIRE
            fi
            if git diff --quiet -- "${files[@]}"; then
              echo "Both artifacts already up to date — nothing to publish."
              exit 0
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "${files[@]}"
            git commit -q \
              -m "docs(changelog): publish release notes to the app and the website" \
              -m "Generated by scripts/release_notes.py from releasenotes/notes/."
            git push origin HEAD:develop && exit 0
            echo "push failed (attempt $attempt), regenerating on the new tip"
            sleep $((2 ** attempt))
          done
          echo "Could not push the changelog to develop." >&2
          echo "If this is a branch-protection rejection, see the header of this workflow." >&2
          exit 1
