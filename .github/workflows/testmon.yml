name: Test database

on:
  push:
    branches: [develop]
    paths:
      - '**/*.py'
      - '**/pyproject.toml'
      - 'uv.lock'
      - 'taskfiles/backend.yml'
      - '.github/workflows/testmon.yml'
      - '.github/actions/setup-python-env/**'

permissions:
  contents: read

concurrency:
  group: testmon-develop
  cancel-in-progress: false

jobs:
  backend-testmon:
    name: Backend test database (testmon)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    services:
      qdrant:
        image: ${{ !vars.CI_RUNNER && 'qdrant/qdrant:v1.19.2' || '' }}
        options: --tmpfs /qdrant/storage
        ports:
          - 6333:6333
    env:
      QDRANT_TEST_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start Qdrant from its binary
        if: ${{ vars.CI_RUNNER }}
        run: QDRANT_HTTP_PORT=6333 bash scripts/qdrant-test-server.sh --start
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.14"
      - uses: ./.github/actions/setup-task
      - run: task be:test:testmon
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .testmondata-*
          key: testmon-develop-${{ github.sha }}
