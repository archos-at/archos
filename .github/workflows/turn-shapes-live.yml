name: Turn shapes (live model)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 2" # Tuesdays 05:00 UTC — off Security's Monday and WorkOS drift's Thursday slots

permissions:
  contents: read

concurrency:
  group: turn-shapes-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  turn-shapes:
    name: ADR-0052 turn shapes against Piloti's live model
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.14"
      - uses: ./.github/actions/setup-task
      - name: Require the model key
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::OPENROUTER_API_KEY is not set; the turn-shape eval would skip, not run. See the header of this workflow."
            exit 1
          fi
      - name: Turn-shape eval
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEFAULT_MODEL: ${{ vars.DEFAULT_MODEL }}
        run: task be:eval:turn-shapes
