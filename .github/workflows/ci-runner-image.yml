name: CI runner image

on:
  pull_request:
    branches: [develop, "claude/**"]
    paths:
      - deploy/ci-runner/**
      - .github/workflows/ci-runner-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-runner-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build the CI runner image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/ci-runner
          push: false
          provenance: false

  push:
    name: Build and push the CI runner image
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/ci-runner
          push: true
          provenance: false
          tags: ghcr.io/${{ github.repository_owner }}/ci-runner:sha-${{ github.sha }}
      - name: The digest the dev stack pins
        env:
          REF: ghcr.io/${{ github.repository_owner }}/ci-runner@${{ steps.build.outputs.digest }}
        run: echo "Set \`ciRunnersImage\` in Pulumi.dev.yaml to \`$REF\`" >> "$GITHUB_STEP_SUMMARY"
