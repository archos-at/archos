name: Source maps

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [develop, "release/**"]

permissions:
  contents: read
  actions: read # the triggering run's artifact

concurrency:
  group: sourcemaps-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  upload:
    name: Upload frontend source maps
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Did the run export source maps
        id: maps
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?name=sourcemaps-frontend" --jq '.total_count')"
          echo "exported=$([ "${count:-0}" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ "${count:-0}" -gt 0 ] || echo "::notice::run $RUN_ID built no frontend image; its chunks kept their ids and PostHog has their maps"

      - name: Fetch the run's source maps
        if: steps.maps.outputs.exported == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sourcemaps-frontend
          path: sourcemaps
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Upload to PostHog
        if: steps.maps.outputs.exported == 'true'
        env:
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          POSTHOG_CLI_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          POSTHOG_CLI_HOST: ${{ vars.POSTHOG_CLI_HOST || 'https://eu.posthog.com' }}
          RELEASE_VERSION: ${{ github.event.workflow_run.head_sha }}
          POSTHOG_CLI_VERSION: "0.18.11"
        run: |
          if [ -z "$POSTHOG_CLI_API_KEY" ] || [ -z "$POSTHOG_CLI_PROJECT_ID" ]; then
            echo "::notice::no PostHog key or project here; source maps not uploaded"
            exit 0
          fi
          npm install --prefix "$RUNNER_TEMP/posthog" --no-save --ignore-scripts "@posthog/cli@$POSTHOG_CLI_VERSION"
          "$RUNNER_TEMP/posthog/node_modules/.bin/posthog-cli" sourcemap upload \
            --directory sourcemaps --release-name workspace-ui --release-version "$RELEASE_VERSION"
