name: PR

# PR hygiene automation. Uses pull_request_target (base-repo context, so it can
# label and comment on PRs) but NEVER checks out or runs PR code — it only reads
# the event payload and the base-branch config, so it is safe with the write
# token.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The repo uses Conventional Commits and squash-merges the PR title, so
      # the title must itself be a valid conventional-commit subject.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            ci
            build
            chore
            revert

  closing-keywords:
    name: Closing keywords
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # GitHub closes an issue on merge only when a closing keyword stands
      # directly before its number: "Fixes #1, #2" closes #1 and leaves #2
      # open. #756 listed 40 issues that way and closed one. The body is read
      # from the event payload through the environment, never interpolated
      # into the script.
      - name: One keyword per issue
        shell: python
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          import os
          import re

          # Hidden template instructions are not issue-closing references.
          body = re.sub(r"<!--.*?-->", "", os.environ.get("BODY", ""), flags=re.DOTALL)
          pattern = re.compile(
              r"\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\b:?\s+#[0-9]+\s*(,|\band\b|&)\s*#[0-9]+",
              re.IGNORECASE,
          )
          matches = list(pattern.finditer(body))
          if matches:
              for match in matches:
                  print(f"  {match.group()}")
              print("::error::A closing keyword is followed by a list of issues, and GitHub closes only the first. Write the keyword before every number: 'Fixes #1, fixes #2'.")
              raise SystemExit(1)

  skip-markers:
    name: No CI skip markers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # GitHub skips push and pull_request workflows outright for a commit
      # message carrying one of these, so CI OK never reports. The squash merge
      # writes the PR's title and body into the commit message, so a marker
      # here also skips the develop push run: no checks, no `sha-` image tags,
      # no staging deploy, and the next merge diffs against the last green
      # commit to make up for it. The safe way to run less is already built
      # in: Plan selects no tier for a change that needs none, and CI OK still
      # reports. Read from the payload through the environment.
      - name: Title and body carry no skip marker
        shell: python
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          import os
          import re

          text = os.environ.get("TITLE", "") + "\n" + os.environ.get("BODY", "")
          pattern = re.compile(r"\[(skip ci|ci skip|no ci|skip actions|actions skip)\]|skip-checks:\s*true", re.IGNORECASE)
          found = sorted({m.group(0) for m in pattern.finditer(text)})
          if found:
              print("::error::" + ", ".join(found) + " in the title or body would skip CI on the merge commit, and with it the image tags and the staging deploy. Remove it; Plan already runs nothing a change does not need.")
              raise SystemExit(1)

  label:
    name: Auto-label by path
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Never block a PR on labeling (e.g. before the labels-as-code sync has
    # seeded them, or a transient labels API hiccup).
    continue-on-error: true
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
