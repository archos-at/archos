name: Security

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security
  cancel-in-progress: true

jobs:
  semgrep:
    name: SAST (Semgrep, full tree)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: semgrep/semgrep:1.177.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep scan
        continue-on-error: true
        run: >-
          semgrep ci --json-output=semgrep.json
          --exclude-rule javascript.lang.security.audit.unsafe-formatstring.unsafe-formatstring
        env:
          SEMGREP_RULES: p/default p/javascript p/typescript p/python p/secrets p/github-actions
      - name: Findings summary
        if: always()
        continue-on-error: true
        run: python3 ci/semgrep_summary.py semgrep.json "the whole tree, backlog included" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-findings
          path: semgrep.json
          retention-days: 14

  osv:
    name: Dependency vulns (OSV-Scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        continue-on-error: true
        with:
          scan-args: |-
            -r
            ./

  gitleaks:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" \
            zricethezav/gitleaks:v8.30.1 detect --source /repo --redact -v

  trivy:
    name: Image vulns (trivy, every pin)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TRIVY_VERSION: "0.61.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 ci/pinned_images.py list | tee pins.txt
      - name: Restore the layer analysis
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .trivy-cache/fanal
          key: trivy-layers-${{ env.TRIVY_VERSION }}-${{ hashFiles('pins.txt') }}
      - run: bash ci/trivy_scan.sh pins.txt
      - name: Save the layer analysis
        if: always() && hashFiles('.trivy-cache/fanal/**') != ''
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .trivy-cache/fanal
          key: trivy-layers-${{ env.TRIVY_VERSION }}-${{ hashFiles('pins.txt') }}
