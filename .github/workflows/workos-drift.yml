name: WorkOS drift

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 4" # Thursdays 05:00 UTC — off Security's Monday slot

permissions:
  contents: read

concurrency:
  group: workos-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: Authz, audit schema + flag drift (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-task
      - run: task workspace:install
      - name: Authorization catalog vs WorkOS
        run: task workspace:provision:authz
        env:
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY_STAGING }}
      - name: Audit log schemas vs WorkOS
        run: task workspace:provision:audit-schemas
        env:
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY_STAGING }}
      - name: Feature-flag registry vs WorkOS
        run: task workspace:provision:flags
        env:
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY_STAGING }}
