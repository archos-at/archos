name: Cancel CI for a closed pull request

on:
  pull_request:
    types: [closed]
    branches: [develop, "release/**", "claude/**"]

permissions: {}

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cancel:
    name: Cancel CI
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "Pull request closed; any CI run still in progress for it was cancelled."
