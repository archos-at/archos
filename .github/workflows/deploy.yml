name: Deploy (staging)

on:
  push:
    branches: [prod]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      imageTag:
        description: >-
          Image tag to deploy. Leave empty for the triggering commit's own
          sha-<40-hex> tag. Set it to a PREVIOUS build's tag to roll the cluster
          back without reverting code — the rollout is gated exactly like a
          forward deploy (surge, soak, drain). It deploys the CURRENT program
          with the older images. With target=prod it rolls PRODUCTION back the same way, behind the
          production reviewers, and the prod branch's next push restores the
          pin its Pulumi.prod.yaml holds (docs/deployment/rollback.md).
        required: false
        type: string
      target:
        description: 'Which stacks to deploy'
        type: choice
        options: [staging, prod, both]
        default: staging

permissions:
  contents: read
  packages: read # verify an image tag exists for all three images before pinning it

env:
  SMOKE_CHECK: |
    set -u
    for path in /api/healthz /api/health; do
      ok=""
      for attempt in 1 2 3 4 5 6; do
        code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$SMOKE_URL$path" || true)"
        if [ "$code" = 200 ]; then ok=1; break; fi
        echo "$SMOKE_URL$path answered ${code:-nothing} (try $attempt of 6)"
        sleep 10
      done
      if [ -z "$ok" ]; then
        echo "::error::smoke check failed: $SMOKE_URL$path never answered 200. The deploy is live; the job summary names the tag to roll back to."
        exit 1
      fi
      echo "$SMOKE_URL$path: 200"
    done

jobs:
  deploy:
    name: Pulumi up (dev)
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_repository.full_name == github.repository)
      || (github.event_name == 'workflow_dispatch' && (inputs.target == 'staging' || inputs.target == 'both'))
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    environment:
      name: staging
      url: ${{ steps.deployed.outputs.url }}
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
      statuses: write
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      IMAGE_TAG: ${{ inputs.imageTag || format('sha-{0}', github.event.workflow_run.head_sha || github.sha) }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      EXPLICIT_TAG: ${{ inputs.imageTag }}
    steps:
      - name: Guard manual dispatch to develop
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/develop' }}
        run: |
          echo "::error::workflow_dispatch deploys are only supported from develop (images for '$GITHUB_REF' are never published)."
          exit 1

      - name: Validate image tag
        run: |
          case "$IMAGE_TAG" in
            sha-[0-9a-f]*) [ "${#IMAGE_TAG}" -eq 44 ] || { echo "::error::sha- tag must be the full 40-hex commit sha"; exit 1; } ;;
            latest) ;;
            v[0-9]*) ;;
            *) echo "::error::refusing image tag '$IMAGE_TAG' — expected sha-<40-hex>, v<version>, or latest."; exit 1 ;;
          esac
          echo "deploying image tag: $IMAGE_TAG"

      # nosemgrep: yaml.github-actions.security.workflow-run-target-code-checkout.workflow-run-target-code-checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0
          filter: blob:none

      - name: Preflight - stack file is configured, not the template
        working-directory: deploy/pulumi
        run: |
          bad=0
          awk -f - Pulumi.dev.yaml <<'AWK' || bad=1
          # Documentation and blank lines carry no configuration.
          /^[[:space:]]*#/ || /^[[:space:]]*$/ { next }

          # Track the current top-level key (column 0 = document root).
          /^[^[:space:]]/ { top = $0; sub(/:.*$/, "", top) }

          /REPLACE_ME|example\.com/ {
            printf "placeholder value still in the stack file: %s\n", $0
            placeholder = 1
          }

          # Committed ciphertext: a `secure:` mapping key inside the config tree.
          top == "config" && /^[[:space:]]+secure:[[:space:]]*[^[:space:]]/ { encrypted = 1 }

          # ESC import: `environment: [grid-oib/dev]` or a `- grid-oib/dev` item
          # under a top-level `environment:` block. Any other value is a
          # different environment and must not satisfy the check.
          top == "environment" {
            entry = $0
            sub(/^[[:space:]]*environment:[[:space:]]*/, "", entry)
            gsub(/[][,"]/, " ", entry)
            sub(/^[[:space:]]*-[[:space:]]*/, " ", entry)
            n = split(entry, fields, /[[:space:]]+/)
            for (i = 1; i <= n; i++) {
              if (fields[i] == "") continue
              if (fields[i] == "grid-oib/dev") esc = 1
              else other = fields[i]
            }
          }

          END {
            if (placeholder) exit 1
            if (top == "") {
              print "Pulumi.dev.yaml has no configuration at all."
              exit 1
            }
            if (!encrypted && !esc) {
              if (other != "") printf "environment: imports %s, not the grid-oib/dev ESC environment\n", other
              else print "no encrypted config found - neither a committed secure: entry under config: nor an environment: import of grid-oib/dev"
              exit 1
            }
          }
          AWK
          if [ "$bad" -ne 0 ]; then
            echo "::error::deploy/pulumi/Pulumi.dev.yaml on develop is still the placeholder template."
            echo "::error::Run the one-time setup in this workflow's header (edit values, set --secret config, COMMIT the file), then re-run."
            exit 1
          fi
          echo "stack file preflight OK"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - uses: ./.github/actions/setup-bun

      - name: Install program deps
        working-directory: deploy/pulumi
        run: bun install --frozen-lockfile

      - name: Install policy-pack deps
        working-directory: deploy/pulumi/policy
        run: bun install --frozen-lockfile

      - name: Typecheck (cluster-free gate)
        working-directory: deploy/pulumi
        run: bun run typecheck && bun run --cwd policy typecheck

      - name: Install Pulumi
        working-directory: deploy/pulumi
        run: |
          version="$(node -p "require('@pulumi/pulumi/package.json').version")"
          # Download the installer to a file first, then run it, rather than
          # piping curl straight into a shell (curl|sh): a hijacked endpoint
          # can't execute in one uninspectable stream.
          curl -fsSL https://get.pulumi.com -o "$RUNNER_TEMP/install-pulumi.sh"
          sh "$RUNNER_TEMP/install-pulumi.sh" --version "$version"

      - name: Preflight - ESC write on workspace/* (ADR-0147)
        continue-on-error: true
        working-directory: deploy/pulumi
        run: |
          export PATH="$HOME/.pulumi/bin:$PATH"
          if [ ! -x scripts/esc-write-preflight.sh ]; then
            echo "::notice::scripts/esc-write-preflight.sh is not in ${DEPLOY_SHA}; skipping the ESC preflight"
            exit 0
          fi
          scripts/esc-write-preflight.sh matthiasbigl warn
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Resolve per-service image refs
        working-directory: deploy/pulumi
        run: |
          export PATH="$HOME/.pulumi/bin:$PATH"
          pulumi stack select matthiasbigl/grid-oib/dev

          # A tag missing for one image would roll that service into
          # ImagePullBackOff, so check every tag this deploy pins by name.
          if [ -n "$RUN_ID" ] || [ -n "$EXPLICIT_TAG" ]; then
            ./scripts/verify-image-tag.sh "$GITHUB_REPOSITORY_OWNER" "$IMAGE_TAG"
          fi

          # Captured first, so a failed guard appends nothing to GITHUB_ENV.
          refs="$(./scripts/resolve-image-refs.sh)"
          printf '%s\n' "$refs" >> "$GITHUB_ENV"
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }} # GHCR tag lookups

      - name: Skip a commit staging already runs
        if: ${{ github.event_name == 'workflow_run' }}
        continue-on-error: true
        working-directory: deploy/pulumi
        run: |
          export PATH="$HOME/.pulumi/bin:$PATH"
          deployed="$(pulumi stack output deployedImages --json)"
          same() { [ "$(jq -r --arg s "$1" '.[$s] // empty' <<<"$deployed")" = "$2" ]; }
          program="$(pulumi stack tag get deployed-commit 2>/dev/null || true)"
          if [ "$program" = "$DEPLOY_SHA" ] && same backend "$BACKEND_IMAGE_REF" \
             && same frontend "$FRONTEND_IMAGE_REF" && same web "$WEB_IMAGE_REF" \
             && { [ -z "$CMS_IMAGE_REF" ] || same cms "$CMS_IMAGE_REF"; } \
             && { [ -z "$CODE_RUNNER_IMAGE_REF" ] || same code-runner "$CODE_RUNNER_IMAGE_REF"; }; then
            echo "::notice::staging already runs ${IMAGE_TAG} on every service; nothing to apply"
            echo "ALREADY_DEPLOYED=true" >> "$GITHUB_ENV"
          fi
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Name the backend release
        if: ${{ env.ALREADY_DEPLOYED != 'true' }}
        id: backend-release
        run: |
          tag="${BACKEND_IMAGE_REF##*:}"
          echo "version=${tag#sha-}" >> "$GITHUB_OUTPUT"

      - name: Resolve the backend's PostHog release
        if: ${{ env.ALREADY_DEPLOYED != 'true' }}
        id: posthog-release
        continue-on-error: true
        uses: PostHog/resolve-release@52d3bea6f86a713545874057b7d4bfebb6b5f367 # v1.0.0
        with:
          api-key: ${{ secrets.POSTHOG_CLI_API_KEY }}
          project-id: ${{ vars.POSTHOG_PROJECT_ID }}
          host: ${{ vars.POSTHOG_CLI_HOST || 'https://eu.posthog.com' }}
          release-name: grid-agent
          release-version: ${{ steps.backend-release.outputs.version }}

      - name: Validate plan (CRD schemas + policy pack)
        if: ${{ env.ALREADY_DEPLOYED != 'true' }}
        working-directory: deploy/pulumi
        run: |
          export PATH="$HOME/.pulumi/bin:$PATH"
          pulumi stack select matthiasbigl/grid-oib/dev
          pulumi config set grid-oib:imageTag "$IMAGE_TAG"
          pulumi config set grid-oib:backendImage "$BACKEND_IMAGE_REF"
          pulumi config set grid-oib:frontendImage "$FRONTEND_IMAGE_REF"
          pulumi config set grid-oib:webImage "$WEB_IMAGE_REF"
          [ -z "$CMS_IMAGE_REF" ] || pulumi config set cmsImage "$CMS_IMAGE_REF"
          [ -z "$CODE_RUNNER_IMAGE_REF" ] || pulumi config set grid-oib:codeRunnerImage "$CODE_RUNNER_IMAGE_REF"
          [ -z "$POSTHOG_RELEASE_ID" ] || pulumi config set grid-oib:posthogReleaseId "$POSTHOG_RELEASE_ID"
          # `--json` puts the plan on stdout, but policy-pack violations are NOT
          # part of it — a mandatory CrossGuard failure shows up as a bare
          # "error: preview failed" with the reason nowhere in the JSON. On
          # failure, re-run in text mode (cheap: the plan is cached server-side)
          # so the violating rule and resource are visible in the log.
          if ! pulumi preview --policy-pack ./policy --json > .plan.json; then
            echo "::error::pulumi preview failed — re-running in text mode to surface the reason"
            pulumi preview --policy-pack ./policy || true
            echo "::error::captured JSON plan follows"
            cat .plan.json
            exit 1
          fi
          node scripts/validate-crs.mjs .plan.json
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          POSTHOG_RELEASE_ID: ${{ steps.posthog-release.outputs.release-id }}

      - name: Remember what is running
        if: ${{ env.ALREADY_DEPLOYED != 'true' }}
        id: previous
        continue-on-error: true
        working-directory: deploy/pulumi
        run: |
          export PATH="$HOME/.pulumi/bin:$PATH"
          # The stack the plan step selected.
          # One rollback command only when all three services had a ref and ran
          # the same tag: a rollback pins all three to one tag. Otherwise the
          # summary names the refs there were and no command.
          deployed="$(pulumi stack output deployedImages --json)"
          tags="$(jq -r '[.backend, .frontend, .web] | if any(. == null or . == "") then "" else map(sub("^.*:"; "")) | unique | join(" ") end' <<<"$deployed")"
          refs="$(jq -r '[.backend, .frontend, .web] | map(select(. != null)) | join(", ")' <<<"$deployed")"
          case "$tags" in *" "*|"") echo "tag=" >> "$GITHUB_OUTPUT" ;; *) echo "tag=$tags" >> "$GITHUB_OUTPUT" ;; esac
          echo "refs=$refs" >> "$GITHUB_OUTPUT"
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Pulumi up
        if: ${{ env.ALREADY_DEPLOYED != 'true' }}
        working-directory: deploy/pulumi
        run: |
          export PATH="$HOME/.pulumi/bin:$PATH"
          pulumi stack select matthiasbigl/grid-oib/dev
          pulumi config set grid-oib:imageTag "$IMAGE_TAG"
          pulumi config set grid-oib:backendImage "$BACKEND_IMAGE_REF"
          pulumi config set grid-oib:frontendImage "$FRONTEND_IMAGE_REF"
          pulumi config set grid-oib:webImage "$WEB_IMAGE_REF"
          [ -z "$CMS_IMAGE_REF" ] || pulumi config set cmsImage "$CMS_IMAGE_REF"
          [ -z "$CODE_RUNNER_IMAGE_REF" ] || pulumi config set grid-oib:codeRunnerImage "$CODE_RUNNER_IMAGE_REF"
          [ -z "$POSTHOG_RELEASE_ID" ] || pulumi config set grid-oib:posthogReleaseId "$POSTHOG_RELEASE_ID"
          # The plan step above previewed this exact config a minute ago, under
          # the same concurrency group; `up` would preview it again (~10 s).
          pulumi up --yes --skip-preview
          # The program this stack now runs, for the skip above.
          pulumi stack tag set deployed-commit "$DEPLOY_SHA"
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          POSTHOG_RELEASE_ID: ${{ steps.posthog-release.outputs.release-id }}

      - name: Project mail - subaddressing
        if: ${{ env.ALREADY_DEPLOYED != 'true' }}
        working-directory: deploy/pulumi
        run: |
          export PATH="$HOME/.pulumi/bin:$PATH"
          ./scripts/inbound-mail-after-deploy.sh subaddress
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Smoke check
        working-directory: deploy/pulumi
        run: |
          export PATH="$HOME/.pulumi/bin:$PATH"
          url="$(pulumi stack output appUrl)"
          SMOKE_URL="$url" bash -c "$SMOKE_CHECK"
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Project mail - launch gates
        if: ${{ env.ALREADY_DEPLOYED != 'true' }}
        working-directory: deploy/pulumi
        run: |
          export PATH="$HOME/.pulumi/bin:$PATH"
          ./scripts/inbound-mail-after-deploy.sh gates
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          INBOUND_MAIL_TEST_ADDRESS: ${{ secrets.INBOUND_MAIL_TEST_ADDRESS }}
      - name: Mark the commit deployed to staging
        if: ${{ env.RUN_ID != '' }}
        continue-on-error: true
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$DEPLOY_SHA" \
            -f state=success -f context=deploy/staging \
            -f description="Staging runs this commit and answered the smoke check" >/dev/null
        env:
          GH_TOKEN: ${{ github.token }}

      - name: How to roll this back
        if: ${{ always() && env.ALREADY_DEPLOYED != 'true' && steps.previous.outputs.refs != '' && steps.previous.outputs.tag != env.IMAGE_TAG }}
        env:
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
          PREVIOUS_REFS: ${{ steps.previous.outputs.refs }}
        run: |
          {
            echo "## Rolling back"
            echo
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "Before this run staging ran \`$PREVIOUS_TAG\` on all three services. To put it back:"
              echo
              echo '```bash'
              echo "gh workflow run deploy.yml --ref develop -f target=staging -f imageTag=$PREVIOUS_TAG"
              echo '```'
            else
              echo "Before this run the services ran different tags ($PREVIOUS_REFS); a rollback pins one tag for all three, so pick one CI passed."
            fi
            echo
            echo "docs/deployment/rollback.md has the rest."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record what was deployed
        if: ${{ env.ALREADY_DEPLOYED != 'true' }}
        id: deployed
        continue-on-error: true
        working-directory: deploy/pulumi
        run: |
          export PATH="$HOME/.pulumi/bin:$PATH"
          url="$(pulumi stack output appUrl --stack matthiasbigl/grid-oib/dev)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "## Staging deployed"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| URL | $url |"
            echo "| Commit | \`$DEPLOY_SHA\` |"
            echo "| Backend | \`$BACKEND_IMAGE_REF\` |"
            echo "| Frontend | \`$FRONTEND_IMAGE_REF\` |"
            echo "| Web | \`$WEB_IMAGE_REF\` |"
            echo "| CMS | \`${CMS_IMAGE_REF:-not pinned}\` |"
            echo "| Code runner | \`${CODE_RUNNER_IMAGE_REF:-not pinned}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Mark the deploy in PostHog
        if: ${{ env.ALREADY_DEPLOYED != 'true' }}
        continue-on-error: true
        run: deploy/pulumi/scripts/posthog-annotate.sh dev "$IMAGE_TAG"
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          POSTHOG_CLI_HOST: ${{ vars.POSTHOG_CLI_HOST }}

      - name: Workspace stack - ESC environment (ADR-0147)
        if: ${{ env.ALREADY_DEPLOYED != 'true' }}
        continue-on-error: true
        working-directory: deploy/pulumi
        run: |
          export PATH="$HOME/.pulumi/bin:$PATH"
          # Develop's workflow can run against an older DEPLOY_SHA (gotchas.md).
          [ -x scripts/esc-workspace-env.sh ] || { echo "::notice::not in ${DEPLOY_SHA}; skipped"; exit 0; }
          scripts/esc-workspace-env.sh matthiasbigl dev Pulumi.dev.yaml warn
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Workspace stack - preview only (ADR-0147)
        if: ${{ env.ALREADY_DEPLOYED != 'true' }}
        continue-on-error: true
        working-directory: deploy/pulumi
        run: |
          export PATH="$HOME/.pulumi/bin:$PATH"
          [ -f workspace/Pulumi.yaml ] || { echo "::notice::not in ${DEPLOY_SHA}; skipped"; exit 0; }
          node scripts/workspace-stack-file.mjs Pulumi.dev.yaml workspace/Pulumi.dev.yaml
          cd workspace
          pulumi stack select --create matthiasbigl/workspace/dev
          pulumi config set workspace:imageTag "$IMAGE_TAG"
          pulumi config set workspace:backendImage "$BACKEND_IMAGE_REF"
          pulumi config set workspace:frontendImage "$FRONTEND_IMAGE_REF"
          pulumi config set workspace:webImage "$WEB_IMAGE_REF"
          if ! pulumi preview --policy-pack ../policy --json > .plan.json; then
            echo "::warning::workspace preview failed (ADR-0147 step 1b) — the reason follows"
            pulumi preview --policy-pack ../policy || true
            exit 1
          fi
          {
            echo "## Workspace stack preview (not applied)"
            echo
            echo '```json'
            node -e 'console.log(JSON.stringify(require("./.plan.json").changeSummary ?? {}, null, 2))'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

  deploy-prod:
    name: Pulumi up (prod)
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.target == 'prod' || inputs.target == 'both')) }}
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    environment:
      name: production
      url: ${{ steps.deployed.outputs.url }}
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      ROLLBACK_TAG: ${{ inputs.imageTag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'prod' }}
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - uses: ./.github/actions/setup-bun

      - name: Install program deps
        working-directory: deploy/pulumi
        run: bun install --frozen-lockfile

      - name: Install policy-pack deps
        working-directory: deploy/pulumi/policy
        run: bun install --frozen-lockfile

      - name: Typecheck (cluster-free gate)
        working-directory: deploy/pulumi
        run: bun run typecheck && bun run --cwd policy typecheck

      - name: Verify the pinned images exist
        working-directory: deploy/pulumi
        run: |
          pinned="$(sed -n 's/^  grid-oib:imageTag: *//p' Pulumi.prod.yaml | tr -d '"' | tr -d "'")"
          tag="${ROLLBACK_TAG:-$pinned}"
          [ -n "$tag" ] || { echo "::error::Pulumi.prod.yaml pins no grid-oib:imageTag"; exit 1; }
          if [ -n "$ROLLBACK_TAG" ]; then
            [[ "$ROLLBACK_TAG" =~ ^sha-[0-9a-f]{40}$ ]] || { echo "::error::a prod rollback takes sha-<40-hex>, not '$ROLLBACK_TAG'"; exit 1; }
            echo "::notice::rolling production back to $ROLLBACK_TAG (Pulumi.prod.yaml pins $pinned)"
          fi
          # The CMS pulls the same tag when the stack runs it.
          cms_enabled="$(sed -n 's/^  grid-oib:cmsEnabled: *//p' Pulumi.prod.yaml | tr -d '"' | tr -d "'")"
          code_runner_enabled="$(sed -n 's/^  grid-oib:codeRunnerEnabled: *//p' Pulumi.prod.yaml | tr -d '"' | tr -d "'")"
          CMS_ENABLED="$cms_enabled" CODE_RUNNER_ENABLED="$code_runner_enabled" \
            ./scripts/verify-image-tag.sh "$GITHUB_REPOSITORY_OWNER" "$tag"
          echo "PROD_IMAGE_TAG=$tag" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install Pulumi
        working-directory: deploy/pulumi
        run: |
          version="$(node -p "require('@pulumi/pulumi/package.json').version")"
          curl -fsSL https://get.pulumi.com -o "$RUNNER_TEMP/install-pulumi.sh"
          sh "$RUNNER_TEMP/install-pulumi.sh" --version "$version"

      - name: Validate plan (CRD schemas + policy pack)
        working-directory: deploy/pulumi
        run: |
          export PATH="$HOME/.pulumi/bin:$PATH"
          pulumi stack select matthiasbigl/grid-oib/prod
          if [ -n "$ROLLBACK_TAG" ]; then
            # A per-service ref wins over imageTag in the program, so with one
            # set the rollback would report a tag the service never ran.
            for key in backendImage frontendImage webImage; do
              if pulumi config get "$key" >/dev/null 2>&1; then
                echo "::error::the prod stack pins $key, which overrides imageTag; a rollback by tag would not reach that service. Remove it from Pulumi.prod.yaml first."
                exit 1
              fi
            done
            pulumi config set imageTag "$ROLLBACK_TAG"
          fi
          # `--json` puts the plan on stdout, but policy-pack violations are NOT
          # part of it — re-run in text mode on failure so the violating rule is
          # visible in the log (the failed plan itself is cached server-side).
          if ! pulumi preview --policy-pack ./policy --json > .plan.json; then
            echo "::error::pulumi preview failed — re-running in text mode to surface the reason"
            pulumi preview --policy-pack ./policy || true
            echo "::error::captured JSON plan follows"
            cat .plan.json
            exit 1
          fi
          node scripts/validate-crs.mjs .plan.json
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Refuse a downgrade
        if: ${{ github.event_name == 'push' }}
        working-directory: deploy/pulumi
        run: |
          export PATH="$HOME/.pulumi/bin:$PATH"
          # The stack the plan step selected.
          ./scripts/prod-downgrade-guard.sh "$PROD_IMAGE_TAG"
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }} # commit dates of a sha the checkout lacks

      - name: Remember what is running
        id: previous
        continue-on-error: true
        working-directory: deploy/pulumi
        run: |
          export PATH="$HOME/.pulumi/bin:$PATH"
          # The stack the plan step selected.
          # One rollback command only when all three services had a ref and ran
          # the same tag: a rollback pins all three to one tag. Otherwise the
          # summary names the refs there were and no command.
          deployed="$(pulumi stack output deployedImages --json)"
          tags="$(jq -r '[.backend, .frontend, .web] | if any(. == null or . == "") then "" else map(sub("^.*:"; "")) | unique | join(" ") end' <<<"$deployed")"
          refs="$(jq -r '[.backend, .frontend, .web] | map(select(. != null)) | join(", ")' <<<"$deployed")"
          case "$tags" in *" "*|"") echo "tag=" >> "$GITHUB_OUTPUT" ;; *) echo "tag=$tags" >> "$GITHUB_OUTPUT" ;; esac
          echo "refs=$refs" >> "$GITHUB_OUTPUT"
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Pulumi up
        working-directory: deploy/pulumi
        run: |
          export PATH="$HOME/.pulumi/bin:$PATH"
          pulumi stack select matthiasbigl/grid-oib/prod
          [ -z "$ROLLBACK_TAG" ] || pulumi config set imageTag "$ROLLBACK_TAG"
          pulumi up --yes --skip-preview
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Project mail - subaddressing
        working-directory: deploy/pulumi
        run: |
          export PATH="$HOME/.pulumi/bin:$PATH"
          ./scripts/inbound-mail-after-deploy.sh subaddress
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Smoke check
        working-directory: deploy/pulumi
        run: |
          export PATH="$HOME/.pulumi/bin:$PATH"
          url="$(pulumi stack output appUrl)"
          SMOKE_URL="$url" bash -c "$SMOKE_CHECK"
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Project mail - launch gates
        working-directory: deploy/pulumi
        run: |
          export PATH="$HOME/.pulumi/bin:$PATH"
          ./scripts/inbound-mail-after-deploy.sh gates
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          INBOUND_MAIL_TEST_ADDRESS: ${{ secrets.INBOUND_MAIL_TEST_ADDRESS }}

      - name: How to roll this back
        if: ${{ always() && steps.previous.outputs.refs != '' && steps.previous.outputs.tag != env.PROD_IMAGE_TAG }}
        env:
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
          PREVIOUS_REFS: ${{ steps.previous.outputs.refs }}
        run: |
          {
            echo "## Rolling back"
            echo
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "Before this run production ran \`$PREVIOUS_TAG\` on all three services. To put it back (the production reviewers approve it like any deploy):"
              echo
              echo '```bash'
              echo "gh workflow run deploy.yml --ref develop -f target=prod -f imageTag=$PREVIOUS_TAG"
              echo '```'
            else
              echo "Before this run the services ran different tags ($PREVIOUS_REFS); a rollback pins one tag for all three, so pick one CI passed."
            fi
            echo
            echo "Then pin it, or the fix, in Pulumi.prod.yaml on prod: the next push to prod applies the file. docs/deployment/rollback.md."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record what was deployed
        id: deployed
        continue-on-error: true
        working-directory: deploy/pulumi
        run: |
          export PATH="$HOME/.pulumi/bin:$PATH"
          url="$(pulumi stack output appUrl --stack matthiasbigl/grid-oib/prod)"
          tag="$PROD_IMAGE_TAG"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "## Production deployed"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| URL | $url |"
            echo "| Commit | \`$(git rev-parse HEAD)\` |"
            echo "| Image tag | \`$tag\` |"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Mark the deploy in PostHog
        continue-on-error: true
        working-directory: deploy/pulumi
        run: ./scripts/posthog-annotate.sh prod "$PROD_IMAGE_TAG"
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          POSTHOG_CLI_HOST: ${{ vars.POSTHOG_CLI_HOST }}
