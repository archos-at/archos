version: '3'

vars:
  UI: apps/workspace
  APM_VERSION: 0.28.0
  # Two setup scripts read this line with awk: keep it one `NAME: value` line.
  AGENT_BROWSER_VERSION: 0.43.0
  WEBSITE: apps/website
  CMS: apps/cms
  VENV_BIN: '{{if eq OS "windows"}}.venv/Scripts{{else}}.venv/bin{{end}}'
  EXE: '{{if eq OS "windows"}}.exe{{end}}'
  PY: '{{.VENV_BIN}}/python{{.EXE}}'
  RUFF: '{{.VENV_BIN}}/ruff{{.EXE}}'
  LINT_IMPORTS: '{{.VENV_BIN}}/lint-imports{{.EXE}}'
  XDIST: -n logical
  VERIFY_SKIP: ruff-check,ruff-format,english-names
  RENO: uv run --no-project --with reno==4.1.0 reno --rel-notes-dir releasenotes
  RELNOTES: uv run --no-project --with reno==4.1.0 python scripts/release_notes.py

env:
  PYTHONPATH: packages/agent/src

includes:
  repo:
    taskfile: taskfiles/repo.yml
    flatten: true
    dir: .
  backend:
    taskfile: taskfiles/backend.yml
    flatten: true
    dir: .
  workspace:
    taskfile: taskfiles/workspace.yml
    flatten: true
    dir: .
  website:
    taskfile: taskfiles/website.yml
    flatten: true
    dir: .
  cms:
    taskfile: taskfiles/cms.yml
    flatten: true
    dir: .
  infra:
    taskfile: taskfiles/infra.yml
    flatten: true
    dir: .
  packages:
    taskfile: taskfiles/packages.yml
    flatten: true
    dir: .

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  verify:
    desc: 'Full merge gate: everything CI runs. Passing here means passing in CI.'
    cmds:
      - 'SKIP={{.VERIFY_SKIP}} {{.TASK_EXE}} lint:repo'
      - '{{.TASK_EXE}} --parallel --output=group be:verify verify:workspace verify:website verify:cms infra:types infra:test'

  verify:fast:
    desc: 'The gate for what this change can break: the tiers and UI specs the diff against origin/develop reaches (-- --all for every tier, -- --dry-run for the plan)'
    cmds:
      - 'SKIP={{.VERIFY_SKIP}} "{{.PY}}" ci/verify_plan.py --task "{{.TASK_EXE}}" {{.CLI_ARGS}}'

  verify:workspace:
    cmds:
      - task: verify:workspace:fast
      - task: workspace:build

  verify:workspace:fast:
    cmds:
      - task: workspace:lint
      - task: workspace:types
      - task: workspace:test

  verify:website:
    cmds:
      - task: verify:website:fast
      - task: website:build

  verify:website:fast:
    cmds:
      - task: website:install
      - task: website:check
      - task: website:test
      - task: art:check

  verify:cms:
    cmds:
      - task: cms:install
      - task: cms:check
      - task: cms:test

  setup:
    desc: Install every toolchain this repo needs (backend venv + UI + website + infra)
    env:
      UV_LINK_MODE: copy
    cmds:
      - uv sync --group dev
      - task: workspace:install
      - task: website:install
      - task: cms:install
      - task: infra:install
      - task: pkg:install
      - task: agents:setup
