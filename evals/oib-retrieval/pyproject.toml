[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=83.0.0", "setuptools-scm>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "oib-retrieval"
version = "1.0.0"
description = "Retrieval evaluation harness for the OIB corpus - structural retrievability, lexical recall, and a gated dense arm"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = {text = "Apache-2.0"}
dependencies = [
    "nvidia-nat-eval==1.9.0",
    "pydantic>=2.0.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dense = [
    "sentence-transformers>=5.0.0",
]

record = [
    "httpx>=0.27",
    "pdfplumber>=0.11",
]

[project.entry-points."nat.plugins"]
oib_retrieval = "oib_retrieval.register"
